name: Strategic Public Data

on:
  pull_request:
    paths:
      - .github/workflows/strategic-public-data.yml
      - backend/src/cli/strategicPublicData.ts
      - backend/src/modules/public-data/strategicPublicDatasetConnector.ts
      - backend/src/modules/public-data/strategicPublicDatasetConnector.test.ts
      - backend/src/services/strategicPublicIngestionService.ts
      - backend/src/services/publicDataDownstreamService.ts
      - db/migrations/065_strategic_source_governance.sql
      - db/migrations/066_origination_factor_map_schema.sql
      - db/migrations/067_strategic_record_signal_sync.sql
      - db/migrations/068_factor_map_runtime.sql
      - db/migrations/069_factor_qualification_integration.sql
      - db/migrations/070_factor_pattern_integration.sql
      - db/migrations/071_factor_lead_pipeline_integration.sql
      - db/migrations/072_factor_outcome_map.sql
      - db/migrations/073_factor_map_backfill.sql
      - db/migrations/074_factor_map_dedup_calibration.sql
  schedule:
    # CVM FRE: semanal, segunda-feira após a janela usual de atualização.
    - cron: "15 09 * * 1"
    # Receita QSA: mensal; checkpoint evita reprocessar a mesma competência.
    - cron: "40 09 8 * *"
  workflow_dispatch:
    inputs:
      dataset:
        description: Fonte estratégica
        required: true
        default: all
        type: choice
        options:
          - all
          - cvm_fre_capital_structure
          - rfb_qsa
      reference:
        description: Competência opcional (YYYY ou YYYY-MM)
        required: false
        type: string
      max_matched_rows:
        description: Máximo de registros aderentes ao Company Master
        required: true
        default: "100000"
        type: string
      max_resources:
        description: Máximo de arquivos oficiais no ciclo
        required: true
        default: "20"
        type: string
      full_coverage:
        description: Marcar cobertura completa quando todos os recursos forem processados
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: strategic-public-data-${{ github.event.schedule || inputs.dataset || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck backend
        run: npm -C backend run typecheck
      - name: Test strategic public connector
        working-directory: backend
        run: npx tsx --test src/modules/public-data/strategicPublicDatasetConnector.test.ts

  ingest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REQUESTED_DATASET: ${{ inputs.dataset || '' }}
      REQUESTED_REFERENCE: ${{ inputs.reference || '' }}
      REQUESTED_MAX_MATCHED_ROWS: ${{ inputs.max_matched_rows || '' }}
      REQUESTED_MAX_RESOURCES: ${{ inputs.max_resources || '' }}
      REQUESTED_FULL_COVERAGE: ${{ inputs.full_coverage || false }}
      SCHEDULE_EXPRESSION: ${{ github.event.schedule || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate ingestion secrets
        run: |
          test -n "$SUPABASE_URL" || (echo "SUPABASE_URL is missing" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "SUPABASE_SERVICE_ROLE_KEY is missing" && exit 1)
      - name: Resolve ingestion scope
        id: scope
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            DATASET="${REQUESTED_DATASET:-all}"
            REFERENCE="$REQUESTED_REFERENCE"
            MAX_MATCHED_ROWS="${REQUESTED_MAX_MATCHED_ROWS:-100000}"
            MAX_RESOURCES="${REQUESTED_MAX_RESOURCES:-20}"
            FULL_COVERAGE="$REQUESTED_FULL_COVERAGE"
          elif [ "$SCHEDULE_EXPRESSION" = "15 09 * * 1" ]; then
            DATASET="cvm_fre_capital_structure"
            REFERENCE=""
            MAX_MATCHED_ROWS="100000"
            MAX_RESOURCES="2"
            FULL_COVERAGE="true"
          else
            DATASET="rfb_qsa"
            REFERENCE=""
            MAX_MATCHED_ROWS="100000"
            MAX_RESOURCES="20"
            FULL_COVERAGE="true"
          fi
          echo "dataset=$DATASET" >> "$GITHUB_OUTPUT"
          echo "reference=$REFERENCE" >> "$GITHUB_OUTPUT"
          echo "max_matched_rows=$MAX_MATCHED_ROWS" >> "$GITHUB_OUTPUT"
          echo "max_resources=$MAX_RESOURCES" >> "$GITHUB_OUTPUT"
          echo "full_coverage=$FULL_COVERAGE" >> "$GITHUB_OUTPUT"
      - name: Run strategic official-data ingestion
        working-directory: backend
        shell: bash
        run: |
          ARGS=(
            --dataset "${{ steps.scope.outputs.dataset }}"
            --max-matched-rows "${{ steps.scope.outputs.max_matched_rows }}"
            --max-resources "${{ steps.scope.outputs.max_resources }}"
            --trigger schedule
            --require-scan
          )
          if [ -n "${{ steps.scope.outputs.reference }}" ]; then ARGS+=(--reference "${{ steps.scope.outputs.reference }}"); fi
          if [ "${{ steps.scope.outputs.full_coverage }}" = "true" ]; then ARGS+=(--full-coverage); fi
          npx tsx src/cli/strategicPublicData.ts "${ARGS[@]}"
