name: Strategic Public Data

on:
  pull_request:
    paths:
      - .github/workflows/strategic-public-data.yml
      - api/strategic-public-data-run.ts
      - vercel.json
      - backend/src/cli/strategicPublicData.ts
      - backend/src/lib/zipArchive.ts
      - backend/src/lib/zipArchive.test.ts
      - backend/src/modules/public-data/strategicPublicDatasetConnector.ts
      - backend/src/modules/public-data/strategicPublicDatasetConnector.test.ts
      - backend/src/services/strategicPublicIngestionService.ts
      - backend/src/services/publicDataDownstreamService.ts
  schedule:
    # Receita QSA: mensal e particionada. CVM FRE roda na Vercel.
    - cron: "40 09 8 * *"
  workflow_dispatch:
    inputs:
      dataset:
        description: Fonte estratégica
        required: true
        default: rfb_qsa
        type: choice
        options:
          - rfb_qsa
          - cvm_fre_capital_structure
          - all
      reference:
        description: Competência opcional (YYYY ou YYYY-MM)
        required: false
        type: string
      max_matched_rows:
        description: Máximo de registros aderentes ao Company Master
        required: true
        default: "100000"
        type: string
      max_resources:
        description: Máximo de arquivos oficiais no ciclo
        required: true
        default: "20"
        type: string
      full_coverage:
        description: Marcar cobertura completa quando todos os recursos forem processados
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: strategic-public-data-${{ github.event.schedule || inputs.dataset || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck backend
        run: npm -C backend run typecheck
      - name: Test bounded ZIP reader and strategic connector
        working-directory: backend
        run: npx tsx --test src/lib/zipArchive.test.ts src/modules/public-data/strategicPublicDatasetConnector.test.ts

  ingest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REQUESTED_DATASET: ${{ inputs.dataset || '' }}
      REQUESTED_REFERENCE: ${{ inputs.reference || '' }}
      REQUESTED_MAX_MATCHED_ROWS: ${{ inputs.max_matched_rows || '' }}
      REQUESTED_MAX_RESOURCES: ${{ inputs.max_resources || '' }}
      REQUESTED_FULL_COVERAGE: ${{ inputs.full_coverage || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Inspect ingestion credential readiness
        id: credentials
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Supabase ingestion credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=QSA ingestion blocked::Configure SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY as GitHub Actions secrets. The source remains visible as waiting/degraded in the Sources control plane."
            {
              echo "## QSA ingestion not executed"
              echo ""
              echo "Required GitHub Actions secrets are missing: SUPABASE_URL and/or SUPABASE_SERVICE_ROLE_KEY."
              echo "The workflow is healthy, but the heavy monthly loader is intentionally blocked until the credentials are configured."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Resolve ingestion scope
        if: steps.credentials.outputs.configured == 'true'
        id: scope
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            DATASET="${REQUESTED_DATASET:-rfb_qsa}"
            REFERENCE="$REQUESTED_REFERENCE"
            MAX_MATCHED_ROWS="${REQUESTED_MAX_MATCHED_ROWS:-100000}"
            MAX_RESOURCES="${REQUESTED_MAX_RESOURCES:-20}"
            FULL_COVERAGE="$REQUESTED_FULL_COVERAGE"
          else
            DATASET="rfb_qsa"
            REFERENCE=""
            MAX_MATCHED_ROWS="100000"
            MAX_RESOURCES="20"
            FULL_COVERAGE="true"
          fi
          echo "dataset=$DATASET" >> "$GITHUB_OUTPUT"
          echo "reference=$REFERENCE" >> "$GITHUB_OUTPUT"
          echo "max_matched_rows=$MAX_MATCHED_ROWS" >> "$GITHUB_OUTPUT"
          echo "max_resources=$MAX_RESOURCES" >> "$GITHUB_OUTPUT"
          echo "full_coverage=$FULL_COVERAGE" >> "$GITHUB_OUTPUT"
      - name: Run strategic official-data ingestion
        if: steps.credentials.outputs.configured == 'true'
        working-directory: backend
        shell: bash
        run: |
          ARGS=(
            --dataset "${{ steps.scope.outputs.dataset }}"
            --max-matched-rows "${{ steps.scope.outputs.max_matched_rows }}"
            --max-resources "${{ steps.scope.outputs.max_resources }}"
            --trigger schedule
            --require-scan
          )
          if [ -n "${{ steps.scope.outputs.reference }}" ]; then ARGS+=(--reference "${{ steps.scope.outputs.reference }}"); fi
          if [ "${{ steps.scope.outputs.full_coverage }}" = "true" ]; then ARGS+=(--full-coverage); fi
          npx tsx src/cli/strategicPublicData.ts "${ARGS[@]}"
