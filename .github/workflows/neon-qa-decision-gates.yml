name: Neon QA Decision Gates

on:
  push:
    branches:
      - fix/origination-decision-gates-neon

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_PJwucES3YmFbxf57HE52Bw0v
      VERCEL_PROJECT_ID: prj_hsB473e7bNF0xOd6CEUwo7WFgNYs
      VERCEL_PROJECT_NAME: motor-originac-srm
      QA_NEON_HOST: ep-noisy-base-b6l3k0u3-pooler.c-2.sa-east-1.aws.neon.tech
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Load production Neon connection from Vercel
        run: bash scripts/load-neon-from-vercel.sh
      - name: Retarget connection to isolated QA
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = process.env.MOTOR_NEON_DATABASE_URL;
          if (!source) throw new Error('MOTOR_NEON_DATABASE_URL missing after Vercel pull');
          const url = new URL(source);
          url.hostname = process.env.QA_NEON_HOST;
          fs.appendFileSync(process.env.GITHUB_ENV, `MOTOR_NEON_DATABASE_URL=${url.toString()}\n`);
          NODE
      - name: Apply canonical migrations on QA
        run: node scripts/apply-neon-runtime-migrations.mjs
      - name: Verify runtime parity
        run: node scripts/neon-runtime-parity-check.mjs
