name: Neon Migration Secret Readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/neon-migration-secret-readiness.yml'
      - '.github/workflows/supabase-storage-recovery-probe.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/neon-migration-secret-readiness.yml'

permissions:
  contents: read

jobs:
  supabase-runtime-secrets:
    name: Secret readiness - Supabase REST
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Verify
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

  supabase-direct-db:
    name: Secret readiness - MOTOR_SUPABASE_DATABASE_URL
    runs-on: ubuntu-latest
    env:
      VALUE: ${{ secrets.MOTOR_SUPABASE_DATABASE_URL }}
    steps:
      - name: Verify
        run: test -n "$VALUE"

  neon-direct-db:
    name: Secret readiness - MOTOR_NEON_DATABASE_URL
    runs-on: ubuntu-latest
    env:
      VALUE: ${{ secrets.MOTOR_NEON_DATABASE_URL }}
    steps:
      - name: Verify
        run: test -n "$VALUE"

  backup-passphrase:
    name: Secret readiness - MOTOR_BACKUP_PASSPHRASE
    runs-on: ubuntu-latest
    env:
      VALUE: ${{ secrets.MOTOR_BACKUP_PASSPHRASE }}
    steps:
      - name: Verify
        run: test -n "$VALUE"

  neon-api-key:
    name: Secret readiness - NEON_API_KEY
    runs-on: ubuntu-latest
    env:
      VALUE: ${{ secrets.NEON_API_KEY }}
    steps:
      - name: Verify
        run: test -n "$VALUE"
