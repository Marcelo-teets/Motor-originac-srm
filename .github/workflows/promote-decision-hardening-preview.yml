name: Promote validated decision hardening preview

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/promote-decision-hardening-preview.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: promote-decision-hardening-preview
  cancel-in-progress: false

jobs:
  promote:
    if: github.head_ref == 'ops/promote-decision-hardening-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_PROJECT_ID: prj_hsB473e7bNF0xOd6CEUwo7WFgNYs
      VERCEL_TEAM_ID: team_PJwucES3YmFbxf57HE52Bw0v
      DEPLOYMENT_ID: dpl_6bWsaUkHzBDZ632mjx5d79Nc8sFZ
      EXPECTED_SOURCE_SHA: b91e40ebad274a700c2055dcf0991dabbafb5b90

    steps:
      - name: Validate Vercel token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            message="[decision-hardening-promotion] VERCEL_TOKEN is not configured; promotion was not attempted."
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" -f body="$message" >/dev/null
            echo "$message" >&2
            exit 1
          fi

      - name: Validate deployment source and readiness
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$VERCEL_TEAM_ID")"
          state="$(jq -r '.readyState // .state // empty' <<<"$response")"
          source_sha="$(jq -r '.meta.githubCommitSha // empty' <<<"$response")"
          if [[ "$state" != "READY" ]]; then
            echo "Deployment is not READY: $state" >&2
            exit 1
          fi
          if [[ "$source_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "Unexpected deployment source: $source_sha" >&2
            exit 1
          fi

      - name: Promote validated deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$DEPLOYMENT_ID?teamId=$VERCEL_TEAM_ID")"
          if [[ "$http_code" == "201" || "$http_code" == "202" ]]; then
            message="[decision-hardening-promotion] success | deployment=$DEPLOYMENT_ID | source=$EXPECTED_SOURCE_SHA | HTTP $http_code"
            exit_code=0
          else
            preview="$(tr '\n' ' ' < "$response_file" | cut -c1-500)"
            message="[decision-hardening-promotion] failure | deployment=$DEPLOYMENT_ID | HTTP $http_code | response=$preview"
            exit_code=1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" -f body="$message" >/dev/null
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          exit "$exit_code"
