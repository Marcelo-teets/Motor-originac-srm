name: Production Auth Smoke

on:
  # The reviewed Vercel Production Deploy workflow already runs strict Auth
  # smoke against its immutable deployed SHA. Deployment-status events may
  # report a Git SHA even when no production artifact was published.
  workflow_dispatch:
    inputs:
      base_url:
        description: Canonical production URL
        required: true
        default: https://motor-originac-srm.vercel.app
        type: string
      expected_sha:
        description: Expected production commit SHA; empty uses the workflow SHA
        required: false
        default: ''
        type: string
      require_captcha_site_key:
        description: Require full email/password Auth instead of accepting OAuth fallback
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  deployments: read

concurrency:
  group: production-auth-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ inputs.base_url }}
      EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
      REQUIRE_CAPTCHA_SITE_KEY: ${{ inputs.require_captcha_site_key }}

    steps:
      - name: Checkout deployment contract
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run production Auth smoke
        run: node scripts/smoke-auth-production.mjs
