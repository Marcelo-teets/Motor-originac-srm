name: Provider Runtime Canary

on:
  pull_request:
    paths:
      - '.github/workflows/provider-runtime-canary.yml'
      - 'api/public-data-operations.ts'
      - 'api/task-ai.ts'
      - 'api/agentetome.ts'
      - 'backend/src/ai/aiGateway.ts'
      - '.github/workflows/knowledge-learning-agent.yml'
      - '.env.example'
      - 'scripts/zero-cost-ai-policy.test.mjs'
      - 'ops/rollouts/agentetome-production-2026-07-26.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/provider-runtime-canary.yml'
      - 'api/public-data-operations.ts'
      - 'api/task-ai.ts'
      - 'api/agentetome.ts'
      - 'backend/src/ai/aiGateway.ts'
      - '.github/workflows/knowledge-learning-agent.yml'
      - '.env.example'
      - 'scripts/zero-cost-ai-policy.test.mjs'
      - 'ops/rollouts/agentetome-production-2026-07-26.json'

permissions:
  contents: read
  issues: write

concurrency:
  group: provider-runtime-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck serverless provider surface
        run: npm run typecheck:serverless
      - name: Enforce zero-cost AI policy
        run: node --test scripts/zero-cost-ai-policy.test.mjs
      - name: Guard sanitized provider probe contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "operation === 'provider-probe'" api/public-data-operations.ts
          grep -F "timingSafeEqual" api/public-data-operations.ts
          grep -F "X-Api-Key" api/public-data-operations.ts
          grep -F "https://data.maisretorno.com/mr-data/v4/api" api/public-data-operations.ts
          grep -F "X-AI-Cost-Policy" api/public-data-operations.ts
          grep -F "blockedByPolicy" api/public-data-operations.ts
          ! grep -Eq "console\.(log|error).*API_KEY|writeJson\(.*API_KEY" api/public-data-operations.ts

  production-canary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PRODUCTION_URL: https://motor-originac-srm.vercel.app
      EXPECTED_SHA: ${{ github.sha }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate canary secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo 'CRON_SECRET is missing.'; exit 1; }

      - name: Wait for exact controlled production artifact
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            CURRENT_SHA="$(curl -fsS --max-time 10 -H 'cache-control: no-cache' "$PRODUCTION_URL/api/health" | jq -r '.data.build.gitSha // empty' || true)"
            if [ "$CURRENT_SHA" = "$EXPECTED_SHA" ]; then
              echo "Production is on expected SHA $EXPECTED_SHA."
              exit 0
            fi
            echo "Attempt $attempt: production=${CURRENT_SHA:-unavailable}; expected=$EXPECTED_SHA"
            sleep 10
          done
          echo "Production did not reach expected SHA $EXPECTED_SHA."
          exit 1

      - name: Probe zero-cost provider control plane
        id: providers
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl -sS --max-time 25 \
            -o /tmp/provider-probe.json \
            -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PRODUCTION_URL/api/sources/public-operations?operation=provider-probe")"
          test "$HTTP_CODE" = '200' -o "$HTTP_CODE" = '207' || { echo "Provider probe HTTP $HTTP_CODE"; exit 1; }
          jq '{status, data:{costPolicy:.data.costPolicy, microsoft:.data.microsoft, taskAi:.data.taskAi, paidProviders:.data.paidProviders, maisRetorno:.data.maisRetorno}}' /tmp/provider-probe.json > /tmp/provider-probe-sanitized.json
          cat /tmp/provider-probe-sanitized.json
          jq -e '.data.costPolicy.mode == "free-only" and .data.costPolicy.locked == true' /tmp/provider-probe.json >/dev/null
          jq -e '.data.taskAi.paidFallbackEnabled == false' /tmp/provider-probe.json >/dev/null
          jq -e '.data.paidProviders.openai.blockedByPolicy == true and .data.paidProviders.anthropic.blockedByPolicy == true and .data.paidProviders.aiGateway.blockedByPolicy == true' /tmp/provider-probe.json >/dev/null
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"

      - name: Verify paid Knowledge worker entrypoint is locked without invoking inference
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl -sS --max-time 15 \
            -o /tmp/knowledge-lock.json \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "$PRODUCTION_URL/api/knowledge-learning-agent")"
          test "$HTTP_CODE" = '423' || { echo "Expected policy lock HTTP 423, got $HTTP_CODE"; cat /tmp/knowledge-lock.json; exit 1; }
          jq -e '.policy == "locked" and .paidProviderAttempted == false' /tmp/knowledge-lock.json >/dev/null
          jq '{httpCode:423,status,policy,paidProviderAttempted}' /tmp/knowledge-lock.json > /tmp/knowledge-lock-sanitized.json
          cat /tmp/knowledge-lock-sanitized.json

      - name: Publish sanitized evidence to issue 461
        if: always()
        shell: bash
        run: |
          PROVIDERS='{"status":"not_run"}'
          LOCK='{"status":"not_run"}'
          test -f /tmp/provider-probe-sanitized.json && PROVIDERS="$(cat /tmp/provider-probe-sanitized.json)"
          test -f /tmp/knowledge-lock-sanitized.json && LOCK="$(cat /tmp/knowledge-lock-sanitized.json)"
          BODY=$(cat <<EOF
          Zero-cost provider runtime canary for production SHA \`$EXPECTED_SHA\`:

          **Provider control plane**
          \`\`\`json
          $PROVIDERS
          \`\`\`

          **Paid Knowledge worker lock**
          \`\`\`json
          $LOCK
          \`\`\`

          No OpenAI, Anthropic or paid AI Gateway inference request is emitted by this canary.
          EOF
          )
          gh issue comment 461 --repo "$GITHUB_REPOSITORY" --body "$BODY"
