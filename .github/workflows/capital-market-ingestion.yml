name: Capital Market Ingestion

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/capital-market-ingestion.yml
      - api/capital-market-run.ts
      - vercel.json
      - backend/src/cli/capitalMarkets.ts
      - backend/src/modules/capital-markets/**
      - backend/src/services/capitalMarketIngestionService.ts
      - db/migrations/035_capital_market_public_data.sql
      - db/migrations/036_capital_market_dataset_runs_source_index.sql
      - db/migrations/043_capital_market_single_running_guard.sql
  schedule:
    # Ofertas públicas: sinal de timing rápido, captura diária.
    - cron: "20 9 * * *"
    # Cadastros e informes: captura semanal, segunda-feira.
    - cron: "40 10 * * 1"
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset CVM ou all
        required: true
        default: cvm_offers
        type: choice
        options:
          - all
          - cvm_offers
          - cvm_fund_registry
          - cvm_fidc_monthly
          - cvm_cri_monthly
          - cvm_cra_monthly
          - cvm_fii_monthly
      reference:
        description: Competência opcional (YYYY-MM ou YYYY)
        required: false
        type: string
      max_rows:
        description: Limite de linhas por dataset
        required: true
        default: "50000"
        type: string

permissions:
  contents: read

concurrency:
  group: capital-market-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      CAPITAL_MARKET_API_URL: https://motor-originac-srm-marcelo-teets-projects.vercel.app/api/capital-markets/run
      REQUESTED_DATASET: ${{ inputs.dataset || '' }}
      REQUESTED_REFERENCE: ${{ inputs.reference || '' }}
      REQUESTED_MAX_ROWS: ${{ inputs.max_rows || '' }}
      SCHEDULE_EXPRESSION: ${{ github.event.schedule || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate serverless probe secret
        if: github.event_name == 'push'
        run: test -n "$CRON_SECRET" || (echo "CRON_SECRET is missing" && exit 1)

      - name: Validate ingestion secrets
        run: |
          test -n "$SUPABASE_URL" || (echo "SUPABASE_URL is missing" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "SUPABASE_SERVICE_ROLE_KEY is missing" && exit 1)

      - name: Typecheck backend
        run: npm -C backend run typecheck

      - name: Test capital-market connector
        run: npm -C backend exec -- tsx --test src/modules/capital-markets/cvmCapitalMarketConnector.test.ts

      - name: Persist recent CVM offers canary directly
        if: github.event_name == 'push'
        run: |
          for ATTEMPT in $(seq 1 12); do
            echo "Direct ingestion attempt ${ATTEMPT}/12"
            if npm -C backend exec -- tsx src/cli/capitalMarkets.ts \
              --dataset cvm_offers \
              --max-rows 250 \
              --trigger manual \
              --require-records; then
              exit 0
            fi
            sleep 15
          done

          echo "Direct capital-market canary did not persist source records."
          exit 1

      - name: Probe exact deployed endpoint
        if: github.event_name == 'push'
        run: |
          for ATTEMPT in $(seq 1 24); do
            echo "Serverless probe attempt ${ATTEMPT}/24 for commit ${GITHUB_SHA}"
            RESPONSE=$(curl -sS --max-time 25 -w "\nHTTP_STATUS:%{http_code}\n" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${CAPITAL_MARKET_API_URL}?dataset=cvm_offers&mode=probe" || true)
            STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | tail -1 | cut -d: -f2)
            BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
            echo "$BODY"
            DEPLOYED_SHA=$(printf '%s' "$BODY" | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>{try{process.stdout.write(JSON.parse(b).deploymentCommitSha||'')}catch{}})")
            PROBE_STATUS=$(printf '%s' "$BODY" | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>{try{process.stdout.write(JSON.parse(b).probe||'')}catch{}})")

            if [ "$DEPLOYED_SHA" != "$GITHUB_SHA" ]; then
              echo "Deployment SHA ${DEPLOYED_SHA:-missing} does not match ${GITHUB_SHA}; retrying after promotion."
              sleep 10
              continue
            fi

            if [ "$STATUS" = "200" ] && [ "$PROBE_STATUS" = "ok" ]; then
              exit 0
            fi

            sleep 10
          done

          echo "Capital-market serverless probe did not complete on the expected deployment."
          exit 1

      - name: Resolve direct ingestion scope
        if: github.event_name != 'push'
        id: scope
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            DATASET="${REQUESTED_DATASET:-cvm_offers}"
            REFERENCE="$REQUESTED_REFERENCE"
            MAX_ROWS="${REQUESTED_MAX_ROWS:-50000}"
            TRIGGER="manual"
          elif [ "$SCHEDULE_EXPRESSION" = "20 9 * * *" ]; then
            DATASET="cvm_offers"
            REFERENCE=""
            MAX_ROWS="50000"
            TRIGGER="schedule"
          else
            DATASET="cvm_fund_registry,cvm_fidc_monthly,cvm_cri_monthly,cvm_cra_monthly,cvm_fii_monthly"
            REFERENCE=""
            MAX_ROWS="100000"
            TRIGGER="schedule"
          fi

          echo "dataset=$DATASET" >> "$GITHUB_OUTPUT"
          echo "reference=$REFERENCE" >> "$GITHUB_OUTPUT"
          echo "max_rows=$MAX_ROWS" >> "$GITHUB_OUTPUT"
          echo "trigger=$TRIGGER" >> "$GITHUB_OUTPUT"
          echo "Resolved dataset=$DATASET max_rows=$MAX_ROWS trigger=$TRIGGER reference=$REFERENCE"

      - name: Ingest CVM capital-market datasets directly
        if: github.event_name != 'push'
        run: |
          ARGS=(--dataset "${{ steps.scope.outputs.dataset }}" --max-rows "${{ steps.scope.outputs.max_rows }}" --trigger "${{ steps.scope.outputs.trigger }}")
          if [ -n "${{ steps.scope.outputs.reference }}" ]; then ARGS+=(--reference "${{ steps.scope.outputs.reference }}"); fi
          npm -C backend exec -- tsx src/cli/capitalMarkets.ts "${ARGS[@]}"
