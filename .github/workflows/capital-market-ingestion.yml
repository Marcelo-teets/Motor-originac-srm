name: Capital Market Ingestion

on:
  schedule:
    # Ofertas publicas: sinal de timing mais rapido, captura diaria.
    - cron: "20 9 * * *"
    # Cadastros e informes mensais: captura semanal, segunda-feira.
    - cron: "40 10 * * 1"
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset CVM ou all
        required: true
        default: cvm_offers
        type: choice
        options:
          - all
          - cvm_offers
          - cvm_fund_registry
          - cvm_fidc_monthly
          - cvm_cri_monthly
          - cvm_cra_monthly
          - cvm_fii_monthly
      reference:
        description: Competencia opcional (YYYY-MM ou YYYY)
        required: false
        type: string
      max_rows:
        description: Limite de linhas por dataset
        required: true
        default: "50000"
        type: string

permissions:
  contents: read

concurrency:
  group: capital-market-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DISPATCH_DATASET: ${{ inputs.dataset || '' }}
      DISPATCH_REFERENCE: ${{ inputs.reference || '' }}
      DISPATCH_MAX_ROWS: ${{ inputs.max_rows || '' }}
      SCHEDULE_EXPRESSION: ${{ github.event.schedule || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        run: |
          test -n "$SUPABASE_URL" || (echo "SUPABASE_URL is missing" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "SUPABASE_SERVICE_ROLE_KEY is missing" && exit 1)

      - name: Typecheck backend
        run: npm -C backend run typecheck

      - name: Resolve incremental ingestion scope
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DATASET="${DISPATCH_DATASET:-cvm_offers}"
            MAX_ROWS="${DISPATCH_MAX_ROWS:-50000}"
            REFERENCE="$DISPATCH_REFERENCE"
            TRIGGER="manual"
          elif [ "$SCHEDULE_EXPRESSION" = "20 9 * * *" ]; then
            DATASET="cvm_offers"
            MAX_ROWS="50000"
            REFERENCE=""
            TRIGGER="schedule"
          else
            DATASET="cvm_fund_registry,cvm_fidc_monthly,cvm_cri_monthly,cvm_cra_monthly,cvm_fii_monthly"
            MAX_ROWS="100000"
            REFERENCE=""
            TRIGGER="schedule"
          fi

          echo "dataset=$DATASET" >> "$GITHUB_OUTPUT"
          echo "max_rows=$MAX_ROWS" >> "$GITHUB_OUTPUT"
          echo "reference=$REFERENCE" >> "$GITHUB_OUTPUT"
          echo "trigger=$TRIGGER" >> "$GITHUB_OUTPUT"
          echo "Resolved dataset=$DATASET max_rows=$MAX_ROWS trigger=$TRIGGER reference=$REFERENCE"

      - name: Ingest CVM capital-market datasets
        run: |
          ARGS=(--dataset "${{ steps.scope.outputs.dataset }}" --max-rows "${{ steps.scope.outputs.max_rows }}" --trigger "${{ steps.scope.outputs.trigger }}")
          if [ -n "${{ steps.scope.outputs.reference }}" ]; then ARGS+=(--reference "${{ steps.scope.outputs.reference }}"); fi
          npm -C backend exec -- tsx src/cli/capitalMarkets.ts "${ARGS[@]}"
