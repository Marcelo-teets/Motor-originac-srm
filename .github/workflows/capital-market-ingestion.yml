name: Capital Market Ingestion

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/capital-market-ingestion.yml
      - api/capital-market-run.ts
      - vercel.json
      - backend/src/cli/capitalMarkets.ts
      - backend/src/cli/capitalMarketDelivery.ts
      - backend/src/modules/capital-markets/**
      - backend/src/services/capitalMarketIngestionService.ts
      - backend/src/services/capitalMarketDeliveryService.ts
      - backend/src/services/capitalMarketDeliveryService.test.ts
      - backend/src/services/.cvm-trigger
      - db/migrations/035_capital_market_public_data.sql
      - db/migrations/036_capital_market_dataset_runs_source_index.sql
      - db/migrations/037_capital_market_incremental_checkpoints.sql
      - db/migrations/038_cleanup_legacy_cvm_canary.sql
      - db/migrations/043_capital_market_single_running_guard.sql
      - db/migrations/092_cvm_delivery_hardening.sql
  pull_request:
    types: [opened]
  issues:
    types: [opened]
  schedule:
    # Ofertas públicas: sinal de timing rápido, captura diária.
    - cron: "20 9 * * *"
    # Cadastros e informes: captura semanal, segunda-feira.
    - cron: "40 10 * * 1"
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset CVM ou all
        required: true
        default: cvm_offers
        type: choice
        options:
          - all
          - cvm_offers
          - cvm_fund_registry
          - cvm_fidc_monthly
          - cvm_cri_monthly
          - cvm_cra_monthly
          - cvm_fii_monthly
      reference:
        description: Competência opcional (YYYY-MM ou YYYY)
        required: false
        type: string
      max_rows:
        description: Limite de linhas por dataset
        required: true
        default: "50000"
        type: string

permissions:
  contents: read

concurrency:
  group: capital-market-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    if: >-
      (github.event_name != 'issues' && github.event_name != 'pull_request') ||
      (github.actor == 'Marcelo-teets' &&
        ((github.event_name == 'issues' && startsWith(github.event.issue.title, '[OPS][CVM_BOOTSTRAP]')) ||
         (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[OPS][CVM_BOOTSTRAP]'))))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      CAPITAL_MARKET_API_URL: https://motor-originac-srm-marcelo-teets-projects.vercel.app/api/capital-markets/run
      REQUESTED_DATASET: ${{ inputs.dataset || '' }}
      REQUESTED_REFERENCE: ${{ inputs.reference || '' }}
      REQUESTED_MAX_ROWS: ${{ inputs.max_rows || '' }}
      SCHEDULE_EXPRESSION: ${{ github.event.schedule || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate serverless probe secret
        if: github.event_name == 'push'
        run: test -n "$CRON_SECRET" || (echo "CRON_SECRET is missing" && exit 1)

      - name: Validate ingestion secrets
        run: |
          test -n "$SUPABASE_URL" || (echo "SUPABASE_URL is missing" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "SUPABASE_SERVICE_ROLE_KEY is missing" && exit 1)

      # Push validation remains strict. Scheduled delivery is not blocked by
      # unrelated tests elsewhere in the monorepo; the ingestion CLI itself is
      # still executed and must complete successfully.
      - name: Typecheck backend
        if: github.event_name == 'push'
        run: npm -C backend run typecheck

      - name: Test capital-market connector and delivery
        if: github.event_name == 'push'
        run: npm -C backend exec -- tsx --test src/modules/capital-markets/cvmCapitalMarketConnector.test.ts src/services/capitalMarketIngestionService.test.ts src/services/capitalMarketDeliveryService.test.ts

      - name: Persist recent CVM offers canary directly
        if: github.event_name == 'push'
        run: |
          for ATTEMPT in $(seq 1 12); do
            echo "Direct ingestion attempt ${ATTEMPT}/12"
            if npm -C backend exec -- tsx src/cli/capitalMarkets.ts \
              --dataset cvm_offers \
              --max-rows 250 \
              --trigger manual \
              --require-records \
              --require-delivery; then
              exit 0
            fi
            sleep 15
          done

          echo "Direct capital-market canary did not persist and deliver source records."
          exit 1

      - name: Prove CVM canary idempotency
        if: github.event_name == 'push'
        run: |
          npm -C backend exec -- tsx src/cli/capitalMarkets.ts \
            --dataset cvm_offers \
            --max-rows 250 \
            --trigger manual \
            --require-records \
            --require-delivery \
            --require-idempotent

      - name: Bootstrap all CVM datasets after migration or explicit trigger
        if: github.event_name == 'push'
        shell: bash
        run: |
          CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}" "${GITHUB_SHA}" || true)
          if ! printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(db/migrations/092_cvm_delivery_hardening.sql|backend/src/services/.cvm-trigger)$'; then
            echo "No CVM migration or explicit bootstrap trigger in this push; full bootstrap skipped."
            exit 0
          fi

          npm -C backend exec -- tsx src/cli/capitalMarkets.ts \
            --dataset all \
            --max-rows 100000 \
            --trigger backfill \
            --require-delivery

      - name: Probe exact deployed endpoint when deployment capacity is available
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          for ATTEMPT in $(seq 1 6); do
            echo "Serverless probe attempt ${ATTEMPT}/6 for commit ${GITHUB_SHA}"
            RESPONSE=$(curl -sS --max-time 25 -w "\nHTTP_STATUS:%{http_code}\n" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${CAPITAL_MARKET_API_URL}?dataset=cvm_offers&mode=probe" || true)
            STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | tail -1 | cut -d: -f2)
            BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
            echo "$BODY"
            DEPLOYED_SHA=$(printf '%s' "$BODY" | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>{try{process.stdout.write(JSON.parse(b).deploymentCommitSha||'')}catch{}})")
            PROBE_STATUS=$(printf '%s' "$BODY" | node -e "let b='';process.stdin.on('data',d=>b+=d).on('end',()=>{try{process.stdout.write(JSON.parse(b).probe||'')}catch{}})")

            if [ "$DEPLOYED_SHA" != "$GITHUB_SHA" ]; then
              echo "Deployment SHA ${DEPLOYED_SHA:-missing} does not match ${GITHUB_SHA}; deployment may be rate-limited."
              sleep 10
              continue
            fi

            if [ "$STATUS" = "200" ] && [ "$PROBE_STATUS" = "ok" ]; then
              exit 0
            fi

            sleep 10
          done

          echo "Data delivery completed, but the exact Vercel deployment could not be probed in this run."
          exit 1

      - name: Resolve direct ingestion scope
        if: github.event_name != 'push'
        id: scope
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "issues" ] || [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            DATASET="all"
            REFERENCE=""
            MAX_ROWS="100000"
            TRIGGER="backfill"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            DATASET="${REQUESTED_DATASET:-cvm_offers}"
            REFERENCE="$REQUESTED_REFERENCE"
            MAX_ROWS="${REQUESTED_MAX_ROWS:-50000}"
            TRIGGER="manual"
          elif [ "$SCHEDULE_EXPRESSION" = "20 9 * * *" ]; then
            DATASET="cvm_offers"
            REFERENCE=""
            MAX_ROWS="50000"
            TRIGGER="schedule"
          else
            DATASET="cvm_fund_registry,cvm_fidc_monthly,cvm_cri_monthly,cvm_cra_monthly,cvm_fii_monthly"
            REFERENCE=""
            MAX_ROWS="100000"
            TRIGGER="schedule"
          fi

          echo "dataset=$DATASET" >> "$GITHUB_OUTPUT"
          echo "reference=$REFERENCE" >> "$GITHUB_OUTPUT"
          echo "max_rows=$MAX_ROWS" >> "$GITHUB_OUTPUT"
          echo "trigger=$TRIGGER" >> "$GITHUB_OUTPUT"
          echo "Resolved dataset=$DATASET max_rows=$MAX_ROWS trigger=$TRIGGER reference=$REFERENCE"

      - name: Ingest and deliver CVM capital-market datasets directly
        if: github.event_name != 'push'
        run: |
          ARGS=(--dataset "${{ steps.scope.outputs.dataset }}" --max-rows "${{ steps.scope.outputs.max_rows }}" --trigger "${{ steps.scope.outputs.trigger }}" --require-delivery)
          if [ -n "${{ steps.scope.outputs.reference }}" ]; then ARGS+=(--reference "${{ steps.scope.outputs.reference }}"); fi
          npm -C backend exec -- tsx src/cli/capitalMarkets.ts "${ARGS[@]}"

      - name: Verify persisted delivery without redownloading
        if: github.event_name != 'push'
        run: npm -C backend exec -- tsx src/cli/capitalMarketDelivery.ts --dataset "${{ steps.scope.outputs.dataset }}" --require-delivery
