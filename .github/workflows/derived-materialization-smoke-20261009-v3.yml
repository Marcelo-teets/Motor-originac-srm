name: Derived Materialization Smoke 20261009 v3

on:
  push:
    branches:
      - ops/derived-materialization-smoke-20261009-v3

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_PJwucES3YmFbxf57HE52Bw0v
      VERCEL_PROJECT_ID: prj_hsB473e7bNF0xOd6CEUwo7WFgNYs
      VERCEL_PROJECT_NAME: motor-originac-srm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 26afa8d37391d5eb597f37f2a31fc7e0de5a43ec
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: bash scripts/load-neon-from-vercel.sh
      - run: npx tsx backend/src/cli/materializeDerivedIntelligence.ts --limit=25
