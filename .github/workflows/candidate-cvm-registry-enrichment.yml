name: Candidate CVM Registry Enrichment

on:
  pull_request:
    paths:
      - .github/workflows/candidate-cvm-registry-enrichment.yml
      - backend/src/cli/candidateCvmRegistry.ts
      - backend/src/modules/public-data/cvmOpenCompanyRegistryConnector.ts
      - backend/src/modules/public-data/cvmOpenCompanyRegistryConnector.test.ts
      - backend/src/services/candidateCvmRegistryService.ts
      - backend/src/services/candidateCvmRegistryService.test.ts
      - db/migrations/122_candidate_cvm_company_registry.sql
      - db/migrations/123_candidate_decision_queue_cvm_coverage_v3.sql
  issues:
    types:
      - opened
  schedule:
    - cron: "30 14 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: Reprocessar a versão atual e o fingerprint corrente
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: candidate-cvm-registry-enrichment
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck backend
        run: npm -C backend run typecheck
      - name: Test CVM candidate enrichment
        working-directory: backend
        run: npx tsx --test src/modules/public-data/cvmOpenCompanyRegistryConnector.test.ts src/services/candidateCvmRegistryService.test.ts

  ingest:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == 'Marcelo-teets' &&
       github.event.issue.title == '[candidate-enrichment-run] cvm-open-companies')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate production secrets
        run: |
          test -n "$SUPABASE_URL" || (echo "SUPABASE_URL is missing" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "SUPABASE_SERVICE_ROLE_KEY is missing" && exit 1)
      - name: Execute official CVM registry enrichment
        id: enrichment
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: |
          set +e
          ARGS=(--trigger manual)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then ARGS=(--trigger schedule); fi
          if [ "${{ inputs.force || false }}" = "true" ]; then ARGS+=(--force); fi
          npx tsx src/cli/candidateCvmRegistry.ts "${ARGS[@]}" 2>&1 | tee candidate-cvm-registry.log
          exit ${PIPESTATUS[0]}
      - name: Report owner canary
        if: always() && github.event_name == 'issues'
        shell: bash
        working-directory: backend
        run: |
          OUTCOME="${{ steps.enrichment.outcome }}"
          LOG_TAIL="No enrichment log was created."
          if [ -f candidate-cvm-registry.log ]; then
            LOG_TAIL=$(tail -n 100 candidate-cvm-registry.log | sed 's/`/\`/g')
          fi
          BODY=$(cat <<EOF
          Candidate CVM registry enrichment diagnostics:

          - execution: **${OUTCOME}**
          - source: official CVM open-company registry
          - coverage: canonical commercial + identity candidates
          - decision mutation: **disabled**

          \`\`\`text
          ${LOG_TAIL}
          \`\`\`
          EOF
          )
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$BODY"
      - name: Enforce successful enrichment
        if: always()
        run: test "${{ steps.enrichment.outcome }}" = "success"
