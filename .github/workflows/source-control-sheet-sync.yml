name: Source Control Sheet Sync

on:
  pull_request:
    paths:
      - '.github/workflows/source-control-sheet-sync.yml'
      - 'scripts/source-control-sheet-sync.mjs'
      - 'scripts/source-control-sheet-sync.test.mjs'
      - 'scripts/source-control-sheet-summary-repair.mjs'
      - 'scripts/source-control-sheet-summary-repair.test.mjs'
      - 'db/migrations/*source_control_sheet*'
      - 'docs/source-control-sheet.md'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'api/**'
      - 'supabase/functions/**'
      - 'db/migrations/**'
      - 'docs/data-sources/**'
      - 'scripts/source-control-sheet-sync.mjs'
      - 'scripts/source-control-sheet-summary-repair.mjs'
      - '.github/workflows/source-control-sheet-sync.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: source-control-sheet-sync
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate source-control synchronization contracts
        run: node --test scripts/source-control-sheet-sync.test.mjs scripts/source-control-sheet-summary-repair.test.mjs

  sync:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check synchronization credentials
        id: credentials
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          google_missing=()
          for name in GOOGLE_DRIVE_CLIENT_ID GOOGLE_DRIVE_CLIENT_SECRET GOOGLE_DRIVE_REFRESH_TOKEN; do
            if [ -z "${!name:-}" ]; then google_missing+=("$name"); fi
          done
          if [ "${#google_missing[@]}" -eq 0 ]; then
            echo 'google_configured=true' >> "$GITHUB_OUTPUT"
            echo 'google_missing=' >> "$GITHUB_OUTPUT"
          else
            echo 'google_configured=false' >> "$GITHUB_OUTPUT"
            printf '%s\n' "${google_missing[@]}" | paste -sd, - | sed 's/^/google_missing=/' >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo 'supabase_configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'supabase_configured=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize official source-control Sheet
        id: canonical_sync
        continue-on-error: true
        if: steps.credentials.outputs.google_configured == 'true' && steps.credentials.outputs.supabase_configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          SOURCE_CONTROL_SPREADSHEET_ID: 1qSMfIrpAbOmBE9x26WhyGk4Cn4AOLk7lAMKfbd1Msag
          SOURCE_CONTROL_SHEET_NAME: Página1
        run: node scripts/source-control-sheet-sync.mjs

      - name: Repair and verify executive summary from displayed rows
        id: summary_repair
        if: always() && steps.credentials.outputs.google_configured == 'true'
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          SOURCE_CONTROL_SPREADSHEET_ID: 1qSMfIrpAbOmBE9x26WhyGk4Cn4AOLk7lAMKfbd1Msag
          SOURCE_CONTROL_SHEET_NAME: Página1
        run: node scripts/source-control-sheet-summary-repair.mjs | tee /tmp/source-control-summary.json

      - name: Publish sanitized synchronization evidence
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          SUMMARY='{"status":"not_run"}'
          test -f /tmp/source-control-summary.json && SUMMARY="$(jq '{status,versionDate,summary}' /tmp/source-control-summary.json)"
          BODY=$(cat <<EOF
          Source-control Sheet synchronization for commit \`${GITHUB_SHA}\`:

          - Google OAuth repository secrets complete: **${{ steps.credentials.outputs.google_configured || 'false' }}**
          - missing Google secret names: **${{ steps.credentials.outputs.google_missing || 'none' }}**
          - Supabase repository secrets complete: **${{ steps.credentials.outputs.supabase_configured || 'false' }}**
          - canonical Supabase → Sheet sync outcome: **${{ steps.canonical_sync.outcome || 'skipped' }}**
          - independent displayed-row summary repair outcome: **${{ steps.summary_repair.outcome || 'skipped' }}**

          \`\`\`json
          $SUMMARY
          \`\`\`

          No secret values are included.
          EOF
          )
          gh issue comment 461 --repo "$GITHUB_REPOSITORY" --body "$BODY"

      - name: Enforce push/manual credential readiness
        if: always() && github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.credentials.outputs.google_configured || 'false' }}" = 'true'
          test "${{ steps.credentials.outputs.supabase_configured || 'false' }}" = 'true'
          test "${{ steps.summary_repair.outcome || 'failure' }}" = 'success'
          test "${{ steps.canonical_sync.outcome || 'failure' }}" = 'success'
