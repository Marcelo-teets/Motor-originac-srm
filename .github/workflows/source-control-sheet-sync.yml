name: Source Control Sheet Sync

on:
  pull_request:
    paths:
      - '.github/workflows/source-control-sheet-sync.yml'
      - 'scripts/source-control-sheet-sync.mjs'
      - 'scripts/source-control-sheet-sync.test.mjs'
      - 'db/migrations/*source_control_sheet*'
      - 'docs/source-control-sheet.md'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'api/**'
      - 'supabase/functions/**'
      - 'db/migrations/**'
      - 'docs/data-sources/**'
      - 'scripts/source-control-sheet-sync.mjs'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-control-sheet-sync
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate source-control synchronization contract
        run: node --test scripts/source-control-sheet-sync.test.mjs

  sync:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check synchronization credentials
        id: credentials
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          if [[ -n "$SUPABASE_URL" && -n "$SUPABASE_SERVICE_ROLE_KEY" && -n "$GOOGLE_DRIVE_CLIENT_ID" && -n "$GOOGLE_DRIVE_CLIENT_SECRET" && -n "$GOOGLE_DRIVE_REFRESH_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Source-control Sheet sync skipped: Google/Supabase secrets are not fully configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Synchronize official source-control Sheet
        if: steps.credentials.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          SOURCE_CONTROL_SPREADSHEET_ID: 1qSMfIrpAbOmBE9x26WhyGk4Cn4AOLk7lAMKfbd1Msag
          SOURCE_CONTROL_SHEET_NAME: Página1
        run: node scripts/source-control-sheet-sync.mjs
