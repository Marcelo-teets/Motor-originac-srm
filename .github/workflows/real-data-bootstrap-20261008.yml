name: Real Data Bootstrap 20261008

on:
  push:
    branches:
      - ops/real-data-bootstrap-20261008

permissions:
  contents: read

concurrency:
  group: real-data-bootstrap-20261008
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_PJwucES3YmFbxf57HE52Bw0v
      VERCEL_PROJECT_ID: prj_hsB473e7bNF0xOd6CEUwo7WFgNYs
      VERCEL_PROJECT_NAME: motor-originac-srm
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      MOTOR_API_BASE_URL: https://motor-originac-srm.vercel.app
      MAX_PARALLELISM: "3"
      MAX_CAPTURE_TARGETS: "50"
      CAPTURE_CADENCE: all
      CAPTURE_RELEASE: github-actions-bootstrap-20261008

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Load canonical Neon connection
        run: bash scripts/load-neon-from-vercel.sh

      - name: Snapshot funnel before bootstrap
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.MOTOR_NEON_DATABASE_URL, max: 1 });
          try {
            const { rows } = await pool.query(`
              select
                (select count(*) from public.companies)::int as companies,
                (select count(*) from public.discovered_company_candidates)::int as candidates,
                (select count(*) from public.search_profile_runs)::int as search_runs,
                (select count(*) from public.capital_market_dataset_runs)::int as capital_runs,
                (select count(*) from public.source_connector_runs)::int as connector_runs
            `);
            console.log(JSON.stringify({phase:'before', ...rows[0]}));
          } finally { await pool.end(); }
          NODE

      - name: Run search-profile discovery against production
        shell: bash
        run: |
          test -n "$CRON_SECRET" || { echo "CRON_SECRET is missing"; exit 1; }
          RESPONSE=$(curl -sS --max-time 300 -X POST -w "\nHTTP_STATUS:%{http_code}\n"             -H "Authorization: Bearer $CRON_SECRET"             "$MOTOR_API_BASE_URL/api/search-profiles/cron/run")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | tail -1 | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          test "$STATUS" -ge 200 -a "$STATUS" -lt 300
          echo "$BODY" | grep -q 'activeProfiles'

      - name: Run CVM offers bootstrap canary
        continue-on-error: true
        shell: bash
        run: |
          PREFLIGHT="$(node scripts/check-neon-storage-budget.mjs --requested-rows=250 --trigger=manual)"
          echo "$PREFLIGHT" | jq .
          if [ "$(echo "$PREFLIGHT" | jq -r '.blocked')" = "true" ]; then
            echo "Storage guard blocked CVM bootstrap."
            exit 0
          fi
          cd backend
          npm exec -- tsx src/cli/capitalMarkets.ts             --dataset cvm_offers             --max-rows 250             --trigger manual             --require-records             --require-delivery

      - name: Run Debentures SND bootstrap canary
        continue-on-error: true
        shell: bash
        run: |
          cd backend
          npm exec -- tsx src/cli/capitalMarkets.ts             --dataset debentures_snd             --max-rows 250             --trigger manual             --require-records             --require-delivery

      - name: Classify governed news candidates
        continue-on-error: true
        working-directory: backend
        run: npm exec -- tsx src/cli/candidateNewsSemantics.ts --limit 250 --force

      - name: Enrich regulated identity with BCB
        continue-on-error: true
        working-directory: backend
        run: npm exec -- tsx src/cli/candidateBcbIdentity.ts --limit 100

      - name: Enrich candidates against CVM registry
        continue-on-error: true
        working-directory: backend
        run: npm exec -- tsx src/cli/candidateCvmRegistry.ts --trigger backfill --force

      - name: Resolve candidate domains
        continue-on-error: true
        working-directory: backend
        run: npm exec -- tsx src/cli/candidateDomainIntelligence.ts --limit 60 --tiers P1,P2,P3 --force

      - name: Verify first-party website identity
        continue-on-error: true
        working-directory: backend
        run: npm exec -- tsx src/cli/candidateWebsiteIdentity.ts --limit 40

      - name: Promote verified entities and reprocess origination
        run: node scripts/run-neon-scheduled-jobs.mjs "--jobs=entity-resolution,reprocessing"

      - name: Capture company-level sources after promotion
        continue-on-error: true
        run: bash scripts/capture/bounded-capture-fanout.sh

      - name: Reprocess derived qualification after capture
        run: node scripts/run-neon-scheduled-jobs.mjs "--jobs=reprocessing"

      - name: Validate real-data bootstrap outcome
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.MOTOR_NEON_DATABASE_URL, max: 1 });
          try {
            const { rows } = await pool.query(`
              select
                (select count(*) from public.companies)::int as companies,
                (select count(*) from public.discovered_company_candidates)::int as candidates,
                (select count(*) from public.search_profile_runs)::int as search_runs,
                (select count(*) from public.capital_market_dataset_runs)::int as capital_runs,
                (select count(*) from public.monitoring_outputs)::int as monitoring_outputs,
                (select count(*) from public.company_signals)::int as signals,
                (select count(*) from public.enrichments)::int as enrichments,
                (select count(*) from public.qualification_snapshots)::int as qualifications,
                (select count(*) from public.company_patterns)::int as patterns,
                (select count(*) from public.lead_score_snapshots)::int as lead_scores,
                (select count(*) from public.ranking_v2)::int as rankings
            `);
            const state = rows[0];
            console.log(JSON.stringify({phase:'after', ...state}));
            if ((state.search_runs + state.capital_runs) < 1) {
              throw new Error('Bootstrap produced no source runs.');
            }
            if (state.candidates < 1 && state.companies < 1) {
              throw new Error('Bootstrap produced neither candidates nor companies.');
            }
          } finally { await pool.end(); }
          NODE
