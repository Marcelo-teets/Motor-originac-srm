name: V5 FIDC Registry Distinct-Offset Provider Canary
# One guarded diagnostic after merging pagination/failure-classification fix.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v5-fidc-provider-offset-canary.yml']
permissions:
  contents: read
concurrency:
  group: v5-fidc-offset-canary
  cancel-in-progress: false
jobs:
  offset-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_PJwucES3YmFbxf57HE52Bw0v
      VERCEL_PROJECT_ID: prj_hsB473e7bNF0xOd6CEUwo7WFgNYs
      VERCEL_PROJECT_NAME: motor-originac-srm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load Neon via Vercel vault
        run: bash scripts/load-neon-from-vercel.sh
      - name: Check guard with just three identity lookups
        id: budget
        run: node scripts/check-neon-storage-budget.mjs --requested-rows=3 --trigger=manual
      - name: Require healthy storage and exact three lookups
        run: |
          test "${{ steps.budget.outputs.state }}" = "healthy"
          test "${{ steps.budget.outputs.blocked }}" = "false"
          test "${{ steps.budget.outputs.effective_rows }}" = "3"
      - name: Sample previously untouched unresolved identities (three offsets)
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          npm exec -- tsx src/cli/fidcAssignorRegistry.ts --limit 1 --offset 20
          npm exec -- tsx src/cli/fidcAssignorRegistry.ts --limit 1 --offset 40
          npm exec -- tsx src/cli/fidcAssignorRegistry.ts --limit 1 --offset 60
      - name: Validate source queue preserved and no implicit promotion
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const pool=new pg.Pool({connectionString:process.env.MOTOR_NEON_DATABASE_URL,max:1});
          try {
            const {rows}=await pool.query(`
              select
                (select count(*)::int from public.fidc_assignor_identity_queue_v5) as cvm_cnpjs,
                (select count(*)::int from public.companies) as companies,
                (select status from private.database_growth_guard_state) as guard
            `);
            const x=rows[0];console.log(JSON.stringify(x));
            if(x.cvm_cnpjs!==85 || x.companies!==2 || x.guard!=='normal')
              throw new Error('CVM lineage, company baseline or storage changed unexpectedly');
          } finally {await pool.end();}
          NODE
