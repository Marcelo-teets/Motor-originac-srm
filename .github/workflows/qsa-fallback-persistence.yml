name: QSA Fallback Persistence

on:
  pull_request:
    paths:
      - .github/workflows/qsa-fallback-persistence.yml
      - api/strategic-public-data-run.ts
      - api/vercelTypes.ts
      - backend/src/modules/public-data/brasilApiQsaFallback.ts
      - backend/src/modules/public-data/brasilApiQsaFallback.test.ts
      - backend/src/services/qsaFallbackIngestionService.ts
      - backend/src/services/qsaFallbackIngestionService.test.ts
      - db/migrations/098_qsa_fallback_governance.sql
      - vercel.json

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck backend
        run: npm -C backend run typecheck
      - name: Compile shared strategic Vercel function
        run: npx tsc --noEmit --skipLibCheck --module NodeNext --moduleResolution NodeNext --target ES2022 --types node api/strategic-public-data-run.ts
      - name: Test QSA fallback normalization and activation
        working-directory: backend
        run: npx tsx --test src/modules/public-data/brasilApiQsaFallback.test.ts src/services/qsaFallbackIngestionService.test.ts
      - name: Guard signal, routing and source governance contract
        shell: bash
        run: |
          grep -F "if new.signal_type = 'ownership_structure_signal'" db/migrations/098_qsa_fallback_governance.sql
          grep -F "return null;" db/migrations/098_qsa_fallback_governance.sql
          grep -F "sourceAuthority', 'secondary_public_api'" db/migrations/098_qsa_fallback_governance.sql
          grep -F "signalsWritten', 0" db/migrations/098_qsa_fallback_governance.sql
          grep -F "mode === 'qsa-fallback'" api/strategic-public-data-run.ts
          grep -F '"schedule": "30 10 8 * *"' vercel.json
          grep -F '"destination": "/api/strategic-public-data-run?mode=qsa-fallback"' vercel.json
          test ! -f api/qsa-fallback-run.ts
