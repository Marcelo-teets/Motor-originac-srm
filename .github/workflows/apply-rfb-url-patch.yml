name: Apply RFB URL Patch

on:
  pull_request:
    paths:
      - .github/workflows/apply-rfb-url-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Replace deprecated Receita endpoint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/src/modules/public-data/strategicPublicDatasetConnector.ts')
          text = path.read_text(encoding='utf-8')
          old = 'https://arquivos.receitafederal.gov.br/cnpj/dados_abertos_cnpj/'
          new = 'https://arquivos.receitafederal.gov.br/dados/cnpj/dados_abertos_cnpj/'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one deprecated RFB URL, found {count}.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          grep -F "https://arquivos.receitafederal.gov.br/dados/cnpj/dados_abertos_cnpj/" backend/src/modules/public-data/strategicPublicDatasetConnector.ts
      - name: Commit guarded patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/public-data/strategicPublicDatasetConnector.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(data): use canonical Receita CNPJ bulk endpoint"
          git push origin "HEAD:${{ github.head_ref }}"
