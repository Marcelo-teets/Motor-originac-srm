name: Diagnose Candidate Decision Queue

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-candidate-queue.yml
      - frontend/src/pages/CandidateDecisionQueuePage.tsx
      - frontend/src/App.tsx

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture frontend diagnostics
        shell: bash
        run: |
          set +e
          npm -C frontend run typecheck > candidate-queue-typecheck.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat candidate-queue-typecheck.log
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-queue-typecheck
          path: candidate-queue-typecheck.log
          if-no-files-found: error
          retention-days: 7
