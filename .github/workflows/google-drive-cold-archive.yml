name: Google Drive Cold Archive

on:
  pull_request:
    paths:
      - '.github/workflows/google-drive-cold-archive.yml'
      - 'scripts/google-drive-cold-archive-migrate.mjs'
      - 'db/migrations/*hot_cold*'
      - 'docs/hot-cold-storage-policy.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/google-drive-cold-archive.yml'
      - 'scripts/google-drive-cold-archive-migrate.mjs'
      - 'db/migrations/*hot_cold*'
      - 'docs/hot-cold-storage-policy.md'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum archive parts per run
        required: true
        default: '25'
        type: string
      delete_staging:
        description: Delete Supabase Storage object after Drive migration
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: google-drive-cold-archive
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate migration script syntax
        run: node --check scripts/google-drive-cold-archive-migrate.mjs

  migrate:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check archive configuration
        id: config
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY GOOGLE_DRIVE_CLIENT_ID GOOGLE_DRIVE_CLIENT_SECRET GOOGLE_DRIVE_REFRESH_TOKEN; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo '## Google Drive Cold Archive — paused'
              echo
              echo 'The archive worker is intentionally paused because required repository secrets are not configured.'
              echo
              echo 'Missing secrets:'
              for name in "${missing[@]}"; do echo "- \`$name\`"; done
              echo
              echo 'No staging object was deleted and no archive metadata was mutated.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Prove Google OAuth and archive destinations
        if: steps.config.outputs.configured == 'true'
        id: google_probe
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ARCHIVE_FOLDER_ID: 16RwLyzLUm45BshgO5Qkr9kZunYBfDuNV
          GOOGLE_DRIVE_CATALOG_SPREADSHEET_ID: 1z29lCdGlZdndvurzZP7LqGPOreyIm5onlnmFvUquY3Y
        run: |
          set -euo pipefail
          TOKEN_JSON="$(curl -fsS --max-time 30 -X POST https://oauth2.googleapis.com/token \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$GOOGLE_DRIVE_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_DRIVE_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_DRIVE_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token')"
          ACCESS_TOKEN="$(printf '%s' "$TOKEN_JSON" | jq -r '.access_token // empty')"
          test -n "$ACCESS_TOKEN" || { echo 'Google OAuth did not return an access token.'; exit 1; }
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files/$GOOGLE_DRIVE_ARCHIVE_FOLDER_ID?fields=id,name,mimeType" \
            | jq -e '.id and .name and .mimeType' >/dev/null
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://sheets.googleapis.com/v4/spreadsheets/$GOOGLE_DRIVE_CATALOG_SPREADSHEET_ID?fields=spreadsheetId,properties.title" \
            | jq -e '.spreadsheetId and .properties.title' >/dev/null
          echo 'oauth_valid=true' >> "$GITHUB_OUTPUT"

      - name: Migrate verified archive parts
        if: steps.config.outputs.configured == 'true' && steps.google_probe.outputs.oauth_valid == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ARCHIVE_FOLDER_ID: 16RwLyzLUm45BshgO5Qkr9kZunYBfDuNV
          GOOGLE_DRIVE_CATALOG_SPREADSHEET_ID: 1z29lCdGlZdndvurzZP7LqGPOreyIm5onlnmFvUquY3Y
          REQUESTED_LIMIT: ${{ inputs.limit || '25' }}
          DELETE_STAGING: ${{ inputs.delete_staging || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          LIMIT="$REQUESTED_LIMIT"
          DELETE="$DELETE_STAGING"
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            LIMIT='1'
            DELETE='false'
          fi
          ARGS=("--limit=${LIMIT}")
          if [ "$DELETE" = 'true' ]; then ARGS+=("--delete-staging"); fi
          node scripts/google-drive-cold-archive-migrate.mjs "${ARGS[@]}" | tee /tmp/google-drive-cold-archive.json

      - name: Publish canary summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Google Drive Cold Archive — execution proof'
            echo
            echo "- repository secrets complete: \`${{ steps.config.outputs.configured || 'false' }}\`"
            echo "- OAuth + Drive + Sheets destinations valid: \`${{ steps.google_probe.outputs.oauth_valid || 'false' }}\`"
            if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
              echo '- push safety limit: `1 archive part`'
              echo '- staging deletion on push: `disabled`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
