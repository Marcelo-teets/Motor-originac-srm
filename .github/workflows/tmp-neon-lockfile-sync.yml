name: Temporary Neon Lockfile Sync

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/package.json'
      - 'package-lock.json'
      - '.github/workflows/tmp-neon-lockfile-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile for backend Neon dependency
        run: npm install --package-lock-only --ignore-scripts --workspace backend

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(backend): sync lockfile for Neon postgres"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
