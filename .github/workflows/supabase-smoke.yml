name: Neon Runtime Smoke

on:
  workflow_dispatch:

jobs:
  neon-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORT: '4000'
      MOTOR_NEON_DATABASE_URL: ${{ secrets.MOTOR_NEON_DATABASE_URL }}
      NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
      NEON_AUTH_JWKS_URL: ${{ secrets.NEON_AUTH_JWKS_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Neon secret
        run: test -n "$MOTOR_NEON_DATABASE_URL" || (echo "MOTOR_NEON_DATABASE_URL is missing" && exit 1)

      - name: Typecheck backend
        run: npm -C backend run typecheck

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Probe Neon schema
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.MOTOR_NEON_DATABASE_URL, max: 1 });
          try {
            const { rows } = await pool.query(`
              select
                to_regclass('public.companies') is not null as companies_ok,
                to_regclass('public.source_catalog') is not null as sources_ok
            `);
            if (!rows[0]?.companies_ok || !rows[0]?.sources_ok) throw new Error('Neon runtime schema is incomplete');
          } finally {
            await pool.end();
          }
          NODE

      - name: Start backend with Neon env
        run: |
          nohup npm run dev:backend > /tmp/motor-backend.log 2>&1 &
          echo $! > /tmp/motor-backend.pid

      - name: Wait for Neon /health
        run: |
          for i in {1..30}; do
            BODY="$(curl -fsS "http://127.0.0.1:${PORT}/health" || true)"
            if [ -n "$BODY" ] && printf '%s' "$BODY" | node -e "
              let b=''; process.stdin.on('data',d=>b+=d).on('end',()=>{
                const p=JSON.parse(b);
                if (p.status==='real' && p.data?.dataProvider==='neon') process.exit(0);
                process.exit(1);
              })"; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend Neon health check failed"
          cat /tmp/motor-backend.log || true
          exit 1

      - name: Stop backend
        if: always()
        run: |
          if [[ -f /tmp/motor-backend.pid ]]; then
            kill "$(cat /tmp/motor-backend.pid)" || true
          fi
