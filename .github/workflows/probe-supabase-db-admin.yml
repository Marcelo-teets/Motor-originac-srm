name: Probe Supabase DB Admin Credentials

on:
  push:
    branches:
      - gpt/close-11-mvp-gates-20260821

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
      HAS_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
      HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
      HAS_POSTGRES_URL: ${{ secrets.POSTGRES_URL != '' }}
      HAS_POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL != '' }}
      HAS_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    steps:
      - name: Report credential availability without values
        shell: bash
        run: |
          printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$HAS_SERVICE_ROLE"
          printf 'SUPABASE_DB_PASSWORD=%s\n' "$HAS_DB_PASSWORD"
          printf 'DATABASE_URL=%s\n' "$HAS_DATABASE_URL"
          printf 'POSTGRES_URL=%s\n' "$HAS_POSTGRES_URL"
          printf 'POSTGRES_PRISMA_URL=%s\n' "$HAS_POSTGRES_PRISMA_URL"
          printf 'SUPABASE_ACCESS_TOKEN=%s\n' "$HAS_ACCESS_TOKEN"
