name: TEMP Neon Safe Branch Cleanup

on:
  push:
    branches:
      - chore/neon-db-cutover
    paths:
      - '.github/workflows/temp-neon-account-inventory.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - name: Delete only validated stale Motor Neon branches
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || { echo "NEON_API_KEY_MISSING"; exit 2; }
          node <<'NODE'
          const projectId='steep-poetry-38942951';
          const keep=new Set(['br-bold-pond-b6vde4xj','br-wispy-math-b6y3br1c','br-little-cherry-b6z5lec2']);
          const targets=[
            ['br-billowing-rain-b68674je','preview/agent/database-growth-circuit-breaker-20261001'],
            ['br-small-wave-b6r4gpez','preview/agent/supabase-recovery-probe-20261001'],
            ['br-wandering-pond-b6gpvdze','preview/feat/full-supabase-drive-export-20261001'],
            ['br-frosty-glitter-b6l4bq3b','mcp-migration-2026-09-28T21-57-50'],
            ['br-solitary-fog-b60d5tww','mcp-migration-2026-09-28T21-53-02'],
            ['br-red-cloud-b6idc3mb','mcp-migration-2026-09-28T21-29-18'],
            ['br-dry-queen-b6eri8zb','mcp-migration-2026-09-28T21-29-09']
          ];
          const base='https://console.neon.tech/api/v2';
          const headers={Authorization:'Bearer '+process.env.NEON_API_KEY,Accept:'application/json'};
          async function req(path,opts={}) {
            const res=await fetch(base+path,{headers,...opts});
            let body=null; try { body=await res.json(); } catch {}
            return {res,body};
          }
          const before=await req('/projects/'+projectId+'/branches');
          if(!before.res.ok) throw new Error('branch list HTTP '+before.res.status);
          const branches=before.body.branches||[];
          const byId=new Map(branches.map(b=>[b.id,b]));
          const primary=branches.filter(b=>b.primary);
          if(primary.length!==1 || primary[0].id!=='br-bold-pond-b6vde4xj') throw new Error('unexpected primary branch');
          for(const id of keep) if(!byId.has(id)) throw new Error('required keep branch missing: '+id);
          for(const [id,name] of targets){
            const b=byId.get(id);
            if(!b) { console.log('ALREADY_ABSENT '+id); continue; }
            if(b.primary) throw new Error('refusing primary '+id);
            if(b.name!==name) throw new Error('name mismatch '+id+' expected='+name+' actual='+b.name);
            if(keep.has(id)) throw new Error('target overlaps keep '+id);
            const del=await req('/projects/'+projectId+'/branches/'+id,{method:'DELETE'});
            console.log('DELETE_STATUS '+id+' '+del.res.status);
            if(!del.res.ok && del.res.status!==404) throw new Error('delete failed '+id+' HTTP '+del.res.status);
          }
          const after=await req('/projects/'+projectId+'/branches');
          if(!after.res.ok) throw new Error('post list HTTP '+after.res.status);
          const remaining=after.body.branches||[];
          console.log('REMAINING_COUNT='+remaining.length);
          for(const b of remaining) console.log('REMAINING '+JSON.stringify({id:b.id,name:b.name,primary:b.primary}));
          const remainingIds=new Set(remaining.map(b=>b.id));
          for(const [id] of targets) if(remainingIds.has(id)) throw new Error('target still present '+id);
          for(const id of keep) if(!remainingIds.has(id)) throw new Error('keep branch missing after cleanup '+id);
          NODE
