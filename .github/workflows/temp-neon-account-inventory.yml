name: TEMP Neon Account Inventory

on:
  push:
    branches:
      - chore/neon-db-cutover
    paths:
      - '.github/workflows/temp-neon-account-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - name: Inventory Neon projects and branches
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || { echo "NEON_API_KEY_MISSING"; exit 2; }
          node <<'NODE'
          const key = process.env.NEON_API_KEY;
          const base = 'https://console.neon.tech/api/v2';
          const headers = { Authorization: 'Bearer ' + key, Accept: 'application/json' };
          async function get(path) {
            const res = await fetch(base + path, { headers });
            if (!res.ok) throw new Error(path + ' HTTP ' + res.status);
            return res.json();
          }
          const p = await get('/projects?limit=100');
          const projects = Array.isArray(p.projects) ? p.projects : [];
          console.log('PROJECT_COUNT=' + projects.length);
          for (const project of projects) {
            const row = {
              id: project.id,
              name: project.name,
              org_id: project.org_id ?? null,
              region_id: project.region_id ?? null,
              created_at: project.created_at ?? null,
              updated_at: project.updated_at ?? null
            };
            console.log('PROJECT ' + JSON.stringify(row));
            try {
              const b = await get('/projects/' + encodeURIComponent(project.id) + '/branches?limit=100');
              const branches = Array.isArray(b.branches) ? b.branches : [];
              console.log('BRANCH_COUNT ' + project.id + ' ' + branches.length);
              for (const branch of branches) {
                console.log('BRANCH ' + project.id + ' ' + JSON.stringify({
                  id: branch.id,
                  name: branch.name,
                  primary: branch.primary ?? false,
                  default: branch.default ?? false,
                  parent_id: branch.parent_id ?? null,
                  created_at: branch.created_at ?? null,
                  updated_at: branch.updated_at ?? null
                }));
              }
            } catch (e) {
              console.log('BRANCH_ERROR ' + project.id + ' ' + e.message);
            }
          }
          NODE
