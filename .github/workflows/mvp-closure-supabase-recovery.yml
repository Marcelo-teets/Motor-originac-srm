name: MVP Closure Supabase Recovery

on:
  push:
    branches:
      - gpt/close-11-mvp-gates-20260821
    paths:
      - .github/workflows/mvp-closure-supabase-recovery.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: mvp-closure-supabase-recovery
  cancel-in-progress: false

jobs:
  recover_and_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_PROJECT_REF: hdghpmssudrqhsbvrdyt
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      USE_SUPABASE: "true"
      MAX_PARALLELISM: "3"
      MAX_CAPTURE_TARGETS: "3"
      CAPTURE_CADENCE: "frequent"
      CAPTURE_RELEASE: "mvp-closure-supabase-recovery"

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: gpt/close-11-mvp-gates-20260821
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Validate protected credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL is missing"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "SUPABASE_SERVICE_ROLE_KEY is missing"; exit 1; }
          case "$SUPABASE_URL" in
            *"$SUPABASE_PROJECT_REF.supabase.co"*) ;;
            *) echo "SUPABASE_URL does not match canonical project ref"; exit 1 ;;
          esac

      - name: Discover CLI and prove administrative connectivity
        shell: bash
        run: |
          set -euo pipefail
          WORKDIR="$RUNNER_TEMP/motor-supabase-recovery"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          supabase init
          supabase --version
          supabase db query --help >/dev/null
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db query --linked --agent yes "select current_database() as database_name, now() as database_time;"
          echo "SUPABASE_RECOVERY_WORKDIR=$WORKDIR" >> "$GITHUB_ENV"

      - name: Apply three MVP closure migrations in order
        shell: bash
        run: |
          set -euo pipefail
          cd "$SUPABASE_RECOVERY_WORKDIR"
          for migration in \
            db/migrations/20260820170500_close_dcm_outreach_loop.sql \
            db/migrations/20260820171500_paperclip_real_control_plane.sql \
            db/migrations/20260820172500_people_capital_runtime_schedule.sql
          do
            echo "Applying $migration"
            supabase db query --linked --agent yes -f "$GITHUB_WORKSPACE/$migration"
          done

      - name: Validate objects RLS RPCs and People Capital schedule
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/mvp-closure-verify.sql" <<'SQL'
          do $$
          declare
            v_people_capital_count integer;
          begin
            if to_regclass('public.dcm_outreach_learning_rules') is null then
              raise exception 'missing dcm_outreach_learning_rules';
            end if;
            if to_regclass('public.paperclip_commands') is null then
              raise exception 'missing paperclip_commands';
            end if;
            if not coalesce((select relrowsecurity from pg_class where oid='public.dcm_outreach_learning_rules'::regclass), false) then
              raise exception 'RLS disabled on dcm_outreach_learning_rules';
            end if;
            if not coalesce((select relrowsecurity from pg_class where oid='public.paperclip_commands'::regclass), false) then
              raise exception 'RLS disabled on paperclip_commands';
            end if;
            if not exists (
              select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
              where n.nspname='public' and p.proname='materialize_dcm_daily_outreach'
            ) then
              raise exception 'missing materialize_dcm_daily_outreach RPC';
            end if;
            if not exists (
              select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
              where n.nspname='public' and p.proname='capture_dcm_outreach_learning_rule'
            ) then
              raise exception 'missing capture_dcm_outreach_learning_rule RPC';
            end if;
            select count(*) into v_people_capital_count
            from public.source_catalog
            where metadata->>'code' in ('src_company_careers','src_tech_signals_latam')
              and metadata->>'implementedRuntime'='true'
              and metadata->'schedulePolicy'->>'runner'='bounded_capture'
              and metadata->'schedulePolicy'->>'cadence'='daily'
              and metadata->'schedulePolicy'->>'enabled'='true';
            if v_people_capital_count <> 2 then
              raise exception 'People & Capital schedule validation failed: %/2 rows', v_people_capital_count;
            end if;
          end $$;

          select
            to_regclass('public.dcm_outreach_learning_rules')::text as outreach_rules,
            to_regclass('public.paperclip_commands')::text as paperclip_commands,
            has_table_privilege('authenticated','public.dcm_outreach_learning_rules','SELECT') as outreach_authenticated_read,
            has_table_privilege('authenticated','public.paperclip_commands','SELECT') as paperclip_authenticated_read;
          SQL
          cd "$SUPABASE_RECOVERY_WORKDIR"
          supabase db query --linked --agent yes -f "$RUNNER_TEMP/mvp-closure-verify.sql"

      - name: Run bounded capture smoke
        shell: bash
        run: bash scripts/capture/bounded-capture-fanout.sh

      - name: Recompute derived intelligence and ranking
        run: npx tsx scripts/recompute-derived-intelligence.ts

      - name: Materialize outreach and enforce zero auto-send
        run: npx tsx scripts/materialize-dcm-daily-outreach.ts

      - name: Publish sanitized recovery result to PR 468
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh pr comment 468 --repo "$GITHUB_REPOSITORY" --body "MVP Closure Supabase Recovery: **${FINAL_STATUS}**. Run ID: \`${GITHUB_RUN_ID}\`. SHA: \`${GITHUB_SHA}\`. Run: ${RUN_URL}. No secret values are included."
