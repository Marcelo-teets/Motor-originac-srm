name: Knowledge Learning Agent

on:
  workflow_dispatch:

concurrency:
  group: knowledge-learning-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  zero-cost-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm zero-cost lock
        run: |
          {
            echo '## Knowledge Learning Agent — zero-cost lock active'
            echo
            echo '- Scheduled execution is disabled.'
            echo '- OpenAI, Anthropic and paid Vercel AI Gateway calls are blocked by repository policy.'
            echo '- This workflow performs no inference and emits no paid-provider request.'
            echo '- Re-enabling paid inference requires explicit user revocation plus a reviewed code change.'
          } >> "$GITHUB_STEP_SUMMARY"
