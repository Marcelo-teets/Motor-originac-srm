name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  cvm-idempotency-proof:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/cvm-idempotency-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Dispatch two official CVM runs sequentially
        shell: bash
        run: |
          node <<'NODE'
          const token = process.env.GH_TOKEN;
          const repo = process.env.GH_REPOSITORY;
          const workflow = 'capital-market-ingestion.yml';
          const api = 'https://api.github.com';
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json',
            'User-Agent': 'Motor-Origination-CI',
          };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function request(path, init = {}) {
            const response = await fetch(`${api}${path}`, { ...init, headers: { ...headers, ...(init.headers || {}) } });
            const text = await response.text();
            if (!response.ok) throw new Error(`${init.method || 'GET'} ${path} failed: ${response.status} ${text}`);
            return text ? JSON.parse(text) : null;
          }

          async function latestDispatchId() {
            const result = await request(`/repos/${repo}/actions/workflows/${workflow}/runs?event=workflow_dispatch&branch=main&per_page=10`);
            return result.workflow_runs?.[0]?.id ?? 0;
          }

          async function dispatchAndWait(label) {
            const baseline = await latestDispatchId();
            await request(`/repos/${repo}/actions/workflows/${workflow}/dispatches`, {
              method: 'POST',
              body: JSON.stringify({ ref: 'main', inputs: { dataset: 'cvm_offers', reference: '', max_rows: '250' } }),
            });

            let run;
            for (let attempt = 1; attempt <= 60; attempt += 1) {
              const result = await request(`/repos/${repo}/actions/workflows/${workflow}/runs?event=workflow_dispatch&branch=main&per_page=10`);
              run = result.workflow_runs?.find((candidate) => candidate.id !== baseline);
              if (run) break;
              console.log(`${label}: waiting for workflow run (${attempt}/60)`);
              await sleep(5000);
            }
            if (!run) throw new Error(`${label}: dispatched workflow run was not created.`);

            for (let attempt = 1; attempt <= 120; attempt += 1) {
              run = await request(`/repos/${repo}/actions/runs/${run.id}`);
              console.log(`${label}: run ${run.id} status=${run.status} conclusion=${run.conclusion || 'pending'}`);
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error(`${label}: workflow concluded ${run.conclusion}.`);
                return run.id;
              }
              await sleep(5000);
            }
            throw new Error(`${label}: workflow did not complete within the polling window.`);
          }

          const first = await dispatchAndWait('first-write');
          const second = await dispatchAndWait('second-pass');
          console.log(JSON.stringify({ first, second }));
          NODE
