name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend quality contract
        run: npm run test:frontend-quality

      - name: Validate Vercel deployment budget guard
        run: npm run test:vercel-deploy-guard

      - name: Validate Vercel Hobby function budget
        run: npm run test:vercel-function-budget

      - name: Validate Vercel production controller
        run: npm run test:vercel-production-control

      - name: Validate Vercel prebuilt workflow contract
        run: npm run test:vercel-production-workflow

      - name: Validate Vercel runtime stability contract
        run: npm run test:vercel-runtime-stability

      - name: Validate CAPTCHA retirement controller
        run: npm run test:auth-captcha-retirement

      - name: Validate sanitized Supabase Auth config audit
        run: npm run test:auth-config-audit

      - name: Validate public Auth environment synchronization
        run: npm run test:auth-public-env

      - name: Validate production Auth smoke contract
        run: npm run test:auth-production-smoke

      - name: Validate company credit review command contract
        run: npm run test:company-credit-review

      - name: Validate Agentetome production contract
        run: npm run test:agentetome-production

      - name: Validate Knowledge Learning Agent service-role contract
        run: npm run test:knowledge-learning-service-role

      - name: Validate Knowledge Learning Agent OIDC contract
        run: npm run test:knowledge-learning-oidc

      - name: Validate Knowledge Learning queue governance
        run: npm run test:knowledge-learning-queue

      - name: Validate pipeline eligibility contract
        run: npm run test:pipeline-eligibility

      - name: Validate capture-derived decision gate
        run: npm run test:capture-derived-decision-gate

      - name: Validate archive queue runtime hardening
        run: npm run test:archive-queue-runtime

      - name: Validate Supabase Edge source parity
        run: npm run test:supabase-edge-source

      - name: Typecheck backend
        run: npm -C backend run typecheck

      - name: Typecheck frontend
        run: npm -C frontend run typecheck

      - name: Typecheck Vercel functions
        id: serverless_typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck:serverless 2>&1 | tee /tmp/serverless-typecheck.log

      - name: Upload serverless typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serverless-typecheck-diagnostics
          path: /tmp/serverless-typecheck.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: npm run build

      - name: Audit production dependency surface
        run: npm run audit:production
