name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate Vercel deployment budget guard
        run: npm run test:vercel-deploy-guard

      - name: Validate Vercel production controller
        run: npm run test:vercel-production-control

      - name: Validate Vercel prebuilt workflow contract
        run: npm run test:vercel-production-workflow

      - name: Validate GoTrue CAPTCHA payload contract
        run: npm run test:auth-captcha-payload

      - name: Validate sanitized Supabase Auth config audit
        run: npm run test:auth-config-audit

      - name: Validate production Auth smoke contract
        run: npm run test:auth-production-smoke

      - name: Validate company credit review command contract
        run: npm run test:company-credit-review

      - name: Typecheck backend
        run: npm -C backend run typecheck

      - name: Typecheck frontend
        run: npm -C frontend run typecheck

      - name: Typecheck Vercel functions
        id: serverless_typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck:serverless 2>&1 | tee /tmp/serverless-typecheck.log

      - name: Upload serverless typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serverless-typecheck-diagnostics
          path: /tmp/serverless-typecheck.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: npm run build
