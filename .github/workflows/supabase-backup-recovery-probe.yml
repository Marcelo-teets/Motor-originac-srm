name: Supabase Backup Recovery Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/supabase-backup-recovery-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: hdghpmssudrqhsbvrdyt
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Validate management token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured"
            exit 2
          fi

      - name: List managed backups
        shell: bash
        run: |
          set -euo pipefail
          http="$(curl -sS -o /tmp/backups.json -w '%{http_code}'             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/backups")"
          echo "BACKUPS_HTTP=$http"
          if [ "$http" != "200" ]; then
            jq -c '{message:(.message // .error // "request_failed")}' /tmp/backups.json || true
            exit 0
          fi
          jq -c '{
            count:(if type=="array" then length else (.backups // [] | length) end),
            backups:(if type=="array" then . else (.backups // []) end | map({
              status, inserted_at, started_at, completed_at, is_physical_backup, type
            }))
          }' /tmp/backups.json

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Supabase backup recovery probe'
            echo
            if [ -f /tmp/backups.json ]; then
              echo '```json'
              jq -c 'if type=="array" then {count:length, backups: map({status,inserted_at,started_at,completed_at,is_physical_backup,type})} else {message:(.message // .error // "unknown"), count:(.backups // [] | length)} end' /tmp/backups.json || true
              echo '```'
            else
              echo 'No backup response was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
