name: Agent Fix CVM Incremental Scope

on:
  push:
    branches:
      - fix/cvm-write-delta
    paths:
      - 'scripts/agent/fix-cvm-incremental-scope.mjs'
      - '.github/workflows/agent-fix-cvm-incremental-scope.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cvm-write-delta
          fetch-depth: 0
      - run: node scripts/agent/fix-cvm-incremental-scope.mjs
      - run: rm scripts/agent/fix-cvm-incremental-scope.mjs .github/workflows/agent-fix-cvm-incremental-scope.yml
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/capitalMarketIngestionService.ts scripts/agent/fix-cvm-incremental-scope.mjs .github/workflows/agent-fix-cvm-incremental-scope.yml
          git commit -m "fix(cvm): keep incremental flag in dataset scope"
          git push origin HEAD:fix/cvm-write-delta
