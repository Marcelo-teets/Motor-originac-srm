name: CVM Canary

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset CVM para amostra controlada
        required: true
        default: cvm_offers
        type: choice
        options:
          - cvm_offers
          - cvm_fund_registry
          - cvm_fidc_monthly
      reference:
        description: Competência opcional (YYYY-MM ou YYYY)
        required: false
        type: string
      max_rows:
        description: Limite rígido de linhas do canário
        required: true
        default: "500"
        type: string

permissions:
  contents: read

concurrency:
  group: cvm-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm -C backend run typecheck
      - name: Validate required secrets
        run: |
          test -n "$SUPABASE_URL" || (echo "SUPABASE_URL is missing" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "SUPABASE_SERVICE_ROLE_KEY is missing" && exit 1)
      - name: Ingest controlled CVM sample
        shell: bash
        run: |
          ARGS=(--dataset "${{ inputs.dataset }}" --max-rows "${{ inputs.max_rows }}" --trigger manual)
          if [ -n "${{ inputs.reference }}" ]; then ARGS+=(--reference "${{ inputs.reference }}"); fi
          npm -C backend exec -- tsx src/cli/capitalMarkets.ts "${ARGS[@]}"
