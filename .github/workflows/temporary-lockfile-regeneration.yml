name: One-shot patched lockfile regeneration

on:
  push:
    branches: [fix/body-parser-cve-2026-111181]
    paths:
      - 'package.json'
      - '.github/workflows/temporary-lockfile-regeneration.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/body-parser-cve-2026-111181
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve patched transitive dependencies from official npm registry
        run: npm update body-parser qs iconv-lite content-type --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Diagnose patched installed versions
        run: node -e "const lock=require('./package-lock.json'); for(const name of ['body-parser','qs','iconv-lite','content-type']) console.log(name,lock.packages['node_modules/'+name]?.version)"
      - name: Confirm restored lockfile is reproducible
        run: npm ci --ignore-scripts
      - name: Enforce zero high-severity production advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Commit lockfile regeneration to this branch only
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "::error::No lockfile change after package override update"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "chore(lockfile): resolve patched production body-parser dependencies"
          git push origin HEAD:fix/body-parser-cve-2026-111181
