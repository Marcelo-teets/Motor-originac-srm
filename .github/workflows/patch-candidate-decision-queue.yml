name: Patch Candidate Decision Queue Branch

on:
  push:
    branches:
      - feat/candidate-decision-queue
    paths:
      - .github/workflows/patch-candidate-decision-queue.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/candidate-decision-queue
          fetch-depth: 0
      - name: Wire backend router
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/src/server.ts')
          text = path.read_text(encoding='utf-8')
          replacements = [
            (
              "import { createWatchlistRouter } from './routes/watchlistRouter.js';\n",
              "import { createWatchlistRouter } from './routes/watchlistRouter.js';\nimport { createCandidateDecisionQueueRouter } from './routes/candidateDecisionQueueRouter.js';\n",
            ),
            (
              "import { SearchProfileCaptureRuntime } from './services/searchProfileCaptureRuntime.js';\n",
              "import { SearchProfileCaptureRuntime } from './services/searchProfileCaptureRuntime.js';\nimport { CandidateDecisionQueueService } from './services/candidateDecisionQueueService.js';\n",
            ),
            (
              "const platformMode = env.useSupabase ? 'real' : 'partial';\n",
              "const candidateDecisionQueueService = new CandidateDecisionQueueService();\nconst platformMode = env.useSupabase ? 'real' : 'partial';\n",
            ),
            (
              "app.use('/watchlists', createWatchlistRouter(repository));\n",
              "app.use('/watchlists', createWatchlistRouter(repository));\napp.use('/candidate-decision-queue', createCandidateDecisionQueueRouter(candidateDecisionQueueService));\n",
            ),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Expected server anchor not found: {old!r}')
            text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/patch-candidate-decision-queue.yml
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(api): wire Candidate Decision Queue"
          git push origin HEAD:feat/candidate-decision-queue
