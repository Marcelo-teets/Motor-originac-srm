name: Apply Neon Review Package

on:
  push:
    branches:
      - claude/revisao-neon-2026-10-06-v2
    paths:
      - .github/workflows/apply-neon-review-package.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/revisao-neon-2026-10-06-v2

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply tasks 01-17 on current main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, subprocess, sys

          doc = pathlib.Path('.github/review/MOTOR-REVISAO-NEON-2026-10-06.md').read_text(encoding='utf-8')
          heads = list(re.finditer(r'^### Tarefa (\d\d)\b', doc, flags=re.M))
          if len(heads) != 17:
              raise SystemExit(f'expected 17 tasks, found {len(heads)}')

          def run(args, **kwargs):
              return subprocess.run(args, text=True, **kwargs)

          for i, head in enumerate(heads):
              num = head.group(1)
              end = heads[i+1].start() if i+1 < len(heads) else doc.find('\n## 5.', head.end())
              section = doc[head.start(): end if end != -1 else len(doc)]

              patch_match = re.search(r'^`````patch tarefa-' + num + r'\n(.*?)^`````$', section, flags=re.S | re.M)
              if not patch_match:
                  raise SystemExit(f'task {num}: patch block not found')

              prefix = section[:patch_match.start()]
              rm_pos = prefix.find('git rm -q --')
              if rm_pos >= 0:
                  rm_block = prefix[rm_pos:]
                  fence = rm_block.find('\n```')
                  if fence >= 0:
                      rm_block = rm_block[:fence]
                  paths = re.findall(r"'([^']+)'", rm_block)
                  if paths:
                      run(['git','rm','-q','--ignore-unmatch','--',*paths], check=True)

              patch_path = pathlib.Path(f'/tmp/tarefa-{num}.patch')
              patch_path.write_text(patch_match.group(1), encoding='utf-8')

              check = run(['git','apply','--check','--whitespace=nowarn',str(patch_path)], capture_output=True)
              if check.returncode == 0:
                  run(['git','apply','--index','--whitespace=nowarn',str(patch_path)], check=True)
              else:
                  reverse = run(['git','apply','--reverse','--check','--whitespace=nowarn',str(patch_path)], capture_output=True)
                  if reverse.returncode == 0:
                      print(f'task {num}: patch already present')
                  else:
                      merge = run(['git','apply','--3way','--index','--whitespace=nowarn',str(patch_path)], capture_output=True)
                      if merge.returncode != 0:
                          conflicts = run(['git','diff','--name-only','--diff-filter=U'], capture_output=True).stdout.splitlines()
                          if num == '15' and conflicts == ['scripts/apply-neon-runtime-migrations.mjs']:
                              # The merged PR #528 added five Neon compatibility waves after
                              # the review base. Keep task 15's complete 199-file plan while
                              # preserving those newer main-only dependencies.
                              run(['git','checkout','--theirs','--','scripts/apply-neon-runtime-migrations.mjs'], check=True)
                              migrator = pathlib.Path('scripts/apply-neon-runtime-migrations.mjs')
                              body = migrator.read_text(encoding='utf-8')
                              additions = [
                                  ("  'db/migrations/076_knowledge_company_workspace.sql',",
                                   "  'db/neon/20261006_neon_pipeline_compatibility.sql',"),
                                  ("  'db/migrations/085_knowledge_execution_actions.sql',",
                                   "  'db/neon/20261006_neon_crm_execution_compatibility.sql',"),
                                  ("  'db/migrations/103_separate_entity_and_decision_eligibility.sql',",
                                   "  'db/neon/20261006_neon_vector_corpus_compatibility.sql',"),
                                  ("  'db/migrations/133_cvm_fund_documents_and_source_schedules.sql',",
                                   "  'db/neon/20261006_neon_bronze_historical_compatibility.sql',\n"
                                   "  'db/neon/20261006_neon_agentetome_base_compatibility.sql',\n"
                                   "  'db/migrations/128_agentetome_production_control_plane.sql',\n"
                                   "  'db/migrations/129_agentetome_current_snapshot_lineage.sql',\n"
                                   "  'db/migrations/130_agentetome_runtime_current_vs_history.sql',"),
                              ]
                              for anchor, extra in additions:
                                  for line in extra.splitlines():
                                      if line.strip().strip("',") in body:
                                          continue
                                  if extra.splitlines()[0] not in body:
                                      if anchor not in body:
                                          raise SystemExit(f'task 15: compatibility anchor missing: {anchor}')
                                      body = body.replace(anchor, extra + '\n' + anchor, 1)
                              migrator.write_text(body, encoding='utf-8')
                              run(['git','add','scripts/apply-neon-runtime-migrations.mjs'], check=True)
                              unresolved = run(['git','diff','--name-only','--diff-filter=U'], capture_output=True).stdout.strip()
                              if unresolved:
                                  raise SystemExit(f'task 15: unresolved conflict remains: {unresolved}')
                              print('task 15: reconciled full review migration plan with current main compatibility waves')
                          elif num == '16' and conflicts == ['scripts/apply-neon-runtime-migrations.mjs']:
                              # Task 16 intentionally moves the inline list to the
                              # canonical migration-plan module. Resolve the refactor
                              # from the review, then preserve newer main-only Neon
                              # compatibility waves in that canonical plan.
                              run(['git','checkout','--theirs','--','scripts/apply-neon-runtime-migrations.mjs'], check=True)
                              plan = pathlib.Path('scripts/lib/neon-migration-plan.mjs')
                              body = plan.read_text(encoding='utf-8')
                              additions = [
                                  ("  ...PRODUCTION_APPLIED,",
                                   "  'db/neon/20261006_neon_pipeline_compatibility.sql',"),
                                  ("  'db/neon/20261006_neon_legacy_runtime_objects.sql',",
                                   "  'db/neon/20261006_neon_bronze_historical_compatibility.sql',"),
                                  ("  'db/migrations/079_agentetome_source_integration.sql',",
                                   "  'db/neon/20261006_neon_agentetome_base_compatibility.sql',"),
                                  ("  'db/migrations/085_knowledge_execution_actions.sql',",
                                   "  'db/neon/20261006_neon_crm_execution_compatibility.sql',"),
                                  ("  'db/migrations/097_knowledge_hybrid_search_v9.sql',",
                                   "  'db/neon/20261006_neon_vector_corpus_compatibility.sql',"),
                              ]
                              for anchor, extra in additions:
                                  if extra not in body:
                                      if anchor not in body:
                                          raise SystemExit(f'task 16: migration-plan anchor missing: {anchor}')
                                      body = body.replace(anchor, anchor + '\n' + extra, 1)
                              plan.write_text(body, encoding='utf-8')

                              # Current main already removed get_agentetome_runtime_secret()
                              # from migration 128. Keep the remaining targeted removals, but
                              # drop only that stale patch rule so drift detection stays strict.
                              patches = pathlib.Path('scripts/lib/neon-migration-patches.mjs')
                              patch_body = patches.read_text(encoding='utf-8')
                              patch_body = ''.join(
                                  line for line in patch_body.splitlines(keepends=True)
                                  if 'get_agentetome_runtime_secret()' not in line
                              )
                              adapted = []
                              for line in patch_body.splitlines(keepends=True):
                                  if "removeFrom: \"create or replace function public.queue_agentetome_admin_export(" in line:
                                      adapted.append('    { removeFrom: "create or replace function public.queue_agentetome_admin_export(", removeThrough: "grant execute on function private.run_agentetome_due_exports() to service_role;" },\\n')
                                  elif "removeFrom: \"select private.refresh_agentetome_source_status();" in line:
                                      adapted.append('    { removeFrom: "select private.refresh_agentetome_source_status();", removeThrough: "select private.refresh_agentetome_source_status();" },\\n')
                                  else:
                                      adapted.append(line)
                              patch_body = ''.join(adapted)
                              patches.write_text(patch_body, encoding='utf-8')

                              run(['git','add','scripts/apply-neon-runtime-migrations.mjs','scripts/lib/neon-migration-plan.mjs','scripts/lib/neon-migration-patches.mjs'], check=True)
                              unresolved = run(['git','diff','--name-only','--diff-filter=U'], capture_output=True).stdout.strip()
                              if unresolved:
                                  raise SystemExit(f'task 16: unresolved conflict remains: {unresolved}')
                              print('task 16: preserved merged main compatibility waves in canonical migration plan')
                          else:
                              print(merge.stdout)
                              print(merge.stderr, file=sys.stderr)
                              raise SystemExit(f'task {num}: git apply --3way failed')

              run(['git','add','-A'], check=True)
              staged = run(['git','diff','--cached','--quiet'])
              if staged.returncode == 0:
                  print(f'task {num}: no net changes')
                  continue
              run(['git','commit','-m',f'fix(review): apply Neon revision task {num}'], check=True)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint
          npm run build
          npm run test:backend
          npm run test:serverless
          npm run test:no-supabase-runtime
          npm run test:neon-migration
          npm run test:legacy-recovery
          npm run audit:production

      - name: Remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/review/MOTOR-REVISAO-NEON-2026-10-06.md
          git rm -f .github/workflows/apply-neon-review-package.yml
          git commit -m "chore(review): remove temporary review transport"

      - name: Push final review branch
        run: git push origin HEAD:claude/revisao-neon-2026-10-06-v2
