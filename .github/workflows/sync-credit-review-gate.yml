name: Sync credit review gate with main

on:
  push:
    branches:
      - agent/company-credit-review-gate

permissions:
  contents: write

concurrency:
  group: sync-credit-review-gate
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/agent/company-credit-review-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/company-credit-review-gate
          fetch-depth: 0
      - name: Merge current main and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-project-agent"
          git config user.email "openai-project-agent@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/sync-credit-review-gate.yml
          git commit -m "chore: sync Credit Review gate with current main"
          git push origin HEAD:agent/company-credit-review-gate
