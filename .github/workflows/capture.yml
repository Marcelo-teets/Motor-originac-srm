name: Capture Data

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/capture.yml
      - scripts/capture/bounded-capture-fanout.sh
      - scripts/capture/run-bounded-capture-batch.ts
      - scripts/recompute-derived-intelligence.ts
      - scripts/materialize-dcm-daily-outreach.ts
      - scripts/direct-capture-runner-contract.test.mjs
      - scripts/bounded-external-fetch-contract.test.mjs
      - api/bounded-capture-*.ts
      - serverless/bounded-capture-*.ts
      - backend/src/services/capture*Service.ts
      - backend/src/services/platformService.ts
      - backend/src/lib/boundedCapture.ts
      - backend/src/lib/boundedExternalFetch.ts
      - backend/src/lib/boundedCaptureSchedule.test.ts
      - backend/src/lib/captureAudit.ts
      - db/migrations/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/capture.yml
      - scripts/capture/bounded-capture-fanout.sh
      - scripts/capture/run-bounded-capture-batch.ts
      - scripts/recompute-derived-intelligence.ts
      - scripts/materialize-dcm-daily-outreach.ts
      - scripts/direct-capture-runner-contract.test.mjs
      - scripts/bounded-external-fetch-contract.test.mjs
      - api/bounded-capture-*.ts
      - serverless/bounded-capture-*.ts
      - backend/src/modules/data-capture/**
      - backend/src/services/capture*Service.ts
      - backend/src/services/platformService.ts
      - backend/src/lib/boundedCapture.ts
      - backend/src/lib/boundedExternalFetch.ts
      - backend/src/lib/boundedCaptureSchedule.test.ts
      - backend/src/lib/captureAudit.ts
      - backend/src/lib/connectors.ts
      - db/migrations/**
  schedule:
    - cron: "0 2,8,14,20 * * *"
    - cron: "15 9 * * *"
    - cron: "30 10 * * 1"
    - cron: "45 11 1 * *"
  workflow_dispatch:
    inputs:
      cadence:
        description: Capture cadence group
        required: true
        default: all
        type: choice
        options: [all, frequent, daily, weekly, monthly]

permissions:
  contents: read

concurrency:
  group: bounded-capture-${{ github.event.schedule || inputs.cadence || github.ref }}
  cancel-in-progress: true

jobs:
  validate_fanout:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate direct fanout shell
        shell: bash
        run: bash -n scripts/capture/bounded-capture-fanout.sh
      - name: Typecheck backend
        run: npm -C backend run typecheck
      - name: Validate operational runner imports
        run: npx tsx -e "Promise.all([import('./scripts/capture/run-bounded-capture-batch.ts'), import('./scripts/recompute-derived-intelligence.ts'), import('./scripts/materialize-dcm-daily-outreach.ts')]).then(() => console.log('operational runners import ok'))"
      - name: Test direct runner contract
        run: node --test scripts/direct-capture-runner-contract.test.mjs
      - name: Test cadence selection
        working-directory: backend
        run: npm exec -- tsx --test src/lib/boundedCaptureSchedule.test.ts
      - name: Test bounded external fetch guard
        run: node --test scripts/bounded-external-fetch-contract.test.mjs

  run_capture:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      USE_SUPABASE: "true"
      MAX_PARALLELISM: "3"
      CAPTURE_RELEASE: "github-actions-direct-v2-company-serialized"
      SCHEDULE_EXPRESSION: ${{ github.event.schedule || '' }}
      REQUESTED_CADENCE: ${{ inputs.cadence || '' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate persistence credentials
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || (echo "SUPABASE_URL is missing" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "SUPABASE_SERVICE_ROLE_KEY is missing" && exit 1)
      - name: Resolve capture scope
        shell: bash
        run: |
          MAX_TARGETS=""
          case "$SCHEDULE_EXPRESSION" in
            "0 2,8,14,20 * * *") CADENCE=frequent ;;
            "15 9 * * *") CADENCE=daily ;;
            "30 10 * * 1") CADENCE=weekly ;;
            "45 11 1 * *") CADENCE=monthly ;;
            *)
              CADENCE="${REQUESTED_CADENCE:-all}"
              if [ "$GITHUB_EVENT_NAME" = "push" ]; then MAX_TARGETS="50"; fi
              ;;
          esac
          echo "CAPTURE_CADENCE=$CADENCE" >> "$GITHUB_ENV"
          if [ -n "$MAX_TARGETS" ]; then echo "MAX_CAPTURE_TARGETS=$MAX_TARGETS" >> "$GITHUB_ENV"; fi
          echo "Resolved cadence: $CADENCE"
          echo "Capture release: $CAPTURE_RELEASE"
          echo "Target cap: ${MAX_TARGETS:-unbounded}"
      - name: Run direct company-source capture
        shell: bash
        run: bash scripts/capture/bounded-capture-fanout.sh
      - name: Recompute qualification patterns scores and ranking
        run: npx tsx scripts/recompute-derived-intelligence.ts
      - name: Materialize daily DCM outreach queue
        run: npx tsx scripts/materialize-dcm-daily-outreach.ts
