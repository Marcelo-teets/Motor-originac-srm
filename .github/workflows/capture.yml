name: Manual Capture Verification

on:
  workflow_dispatch: {}

jobs:
  run_capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run data capture endpoint
        env:
          CAPTURE_TOKEN: ${{ secrets.CRON_SECRET }}
          CAPTURE_URL: https://motor-originac-srm-marcelo-teets-projects.vercel.app/api/data-capture/run
        run: |
          test -n "$CAPTURE_TOKEN" || (echo "capture token is missing" && exit 1)
          test -n "$CAPTURE_URL" || (echo "capture url is missing" && exit 1)

          HEADER_NAME="Authorization"
          HEADER_VALUE="Bearer ${CAPTURE_TOKEN}"

          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            -H "${HEADER_NAME}: ${HEADER_VALUE}" \
            "$CAPTURE_URL")

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')

          if [ "$STATUS" -ne 200 ]; then
            echo "Capture did not finish as real (HTTP $STATUS)"
            exit 1
          fi

          echo "$BODY" | jq -e '.status == "real"' >/dev/null || (echo "Capture runtime returned a degraded status" && exit 1)
          echo "$BODY" | jq -e '.data.companiesProcessed >= 1' >/dev/null || (echo "Capture did not process companies" && exit 1)
          echo "$BODY" | jq -e '.data.persisted.status == "real"' >/dev/null || (echo "Persistence did not finish as real" && exit 1)
          echo "$BODY" | jq -e '.data.derived.status == "real"' >/dev/null || (echo "Derived sync did not finish as real" && exit 1)
