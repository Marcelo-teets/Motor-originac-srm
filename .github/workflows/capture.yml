name: Capture Data

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/capture.yml
      - scripts/capture/bounded-capture-fanout.sh
      - api/bounded-capture-*.ts
      - backend/src/services/capture*Service.ts
      - backend/src/lib/boundedCapture.ts
      - backend/src/lib/captureAudit.ts
  push:
    branches:
      - main
    paths:
      - .github/workflows/capture.yml
      - scripts/capture/bounded-capture-fanout.sh
      - api/bounded-capture-*.ts
      - backend/src/modules/data-capture/**
      - backend/src/services/capture*Service.ts
      - backend/src/lib/boundedCapture.ts
      - backend/src/lib/captureAudit.ts
      - backend/src/lib/connectors.ts
      - db/migrations/**
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

concurrency:
  group: bounded-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_fanout:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded fanout shell
        shell: bash
        run: bash -n scripts/capture/bounded-capture-fanout.sh

  run_capture:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAPTURE_TOKEN: ${{ secrets.CRON_SECRET }}
      TARGETS_URL: https://motor-originac-srm.vercel.app/api/bounded-capture-targets
      CAPTURE_URL: https://motor-originac-srm.vercel.app/api/bounded-capture-run
      MAX_PARALLELISM: "3"

    steps:
      - uses: actions/checkout@v4
      - name: Run bounded company-source fanout
        shell: bash
        run: bash scripts/capture/bounded-capture-fanout.sh
