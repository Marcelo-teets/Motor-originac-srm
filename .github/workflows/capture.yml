name: Capture Data

on:
  schedule:
    # Roda todos os dias às 08:00 UTC
    # No horário de Brasília, normalmente equivale a 05:00.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  run_capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run data capture endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CAPTURE_URL: https://motor-originac-srm-marcelo-teets-projects.vercel.app/api/data-capture/run
        run: |
          test -n "$CRON_SECRET" || (echo "CRON_SECRET is missing" && exit 1)
          test -n "$CAPTURE_URL" || (echo "CAPTURE_URL is missing" && exit 1)

          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CAPTURE_URL")

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Capture failed with status $STATUS"
            exit 1
          fi

          echo "$BODY" | grep -q 'companiesProcessed' || (echo "Capture endpoint did not return the expected runtime payload" && exit 1)
          echo "$BODY" | grep -q 'persisted' || (echo "Capture endpoint did not return persistence summary" && exit 1)
