name: Supabase REST Recovery Probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/supabase-rest-recovery-probe.yml'
      - 'scripts/migration/supabase-rest-health-classifier.mjs'
      - 'scripts/migration/supabase-rest-export.mjs'
      - 'scripts/migration/neon-migration-manifest.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-rest-recovery-probe.yml'
      - 'scripts/migration/supabase-rest-health-classifier.mjs'
      - 'scripts/migration/supabase-rest-export.mjs'
      - 'scripts/migration/neon-migration-manifest.mjs'

permissions:
  contents: read

concurrency:
  group: supabase-rest-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Probe ${{ matrix.table }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        table:
          - companies
          - source_catalog
          - monitoring_outputs
          - company_signals
          - qualification_snapshots
          - company_patterns
          - score_snapshots
          - lead_score_snapshots
          - pipeline
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify secrets are configured
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL missing"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "SUPABASE_SERVICE_ROLE_KEY missing"; exit 1; }

      - name: Classify REST table
        id: classify
        run: node scripts/migration/supabase-rest-health-classifier.mjs --table="${{ matrix.table }}"

      - name: Result reachable
        if: steps.classify.outputs.class == 'reachable'
        run: echo "REST reachable"

      - name: Result database timeout
        if: steps.classify.outputs.class == 'db_timeout'
        run: echo "REST failed because the Supabase database connection timed out"

      - name: Result storage quota
        if: steps.classify.outputs.class == 'quota'
        run: echo "REST is blocked by Supabase database-size quota"

      - name: Result authentication
        if: steps.classify.outputs.class == 'auth'
        run: echo "REST authentication failed"

      - name: Result missing table or route
        if: steps.classify.outputs.class == 'missing_table_or_route'
        run: echo "REST route/table not found"

      - name: Result upstream 5xx
        if: steps.classify.outputs.class == 'upstream_5xx'
        run: echo "REST returned an upstream 5xx response"

      - name: Result network timeout
        if: steps.classify.outputs.class == 'network_timeout'
        run: echo "REST request timed out before an HTTP response"

      - name: Result network error
        if: steps.classify.outputs.class == 'network_error'
        run: echo "REST request failed at network layer"

      - name: Result other
        if: steps.classify.outputs.class == 'other'
        run: echo "REST failed with an unclassified response"

      - name: Fail unhealthy REST
        if: steps.classify.outputs.class != 'reachable'
        run: exit 1
