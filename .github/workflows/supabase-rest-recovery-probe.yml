name: Supabase REST Recovery Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-rest-recovery-probe.yml'
      - 'scripts/migration/supabase-rest-export.mjs'
      - 'scripts/migration/neon-migration-manifest.mjs'

permissions:
  contents: read

concurrency:
  group: supabase-rest-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Probe ${{ matrix.table }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        table:
          - companies
          - source_catalog
          - monitoring_outputs
          - company_signals
          - qualification_snapshots
          - company_patterns
          - score_snapshots
          - lead_score_snapshots
          - pipeline
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify secrets are configured
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL missing"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "SUPABASE_SERVICE_ROLE_KEY missing"; exit 1; }

      - name: Probe REST table
        run: |
          node scripts/migration/supabase-rest-export.mjs \
            --probe \
            --tables="${{ matrix.table }}" \
            --page-size=1 \
            --out="tmp/probe-${{ matrix.table }}"
