name: Supabase REST Recovery Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-rest-recovery-probe.yml'
      - 'scripts/migration/supabase-rest-export.mjs'
      - 'scripts/migration/neon-migration-manifest.mjs'

permissions:
  contents: read

concurrency:
  group: supabase-rest-recovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify secrets are configured
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL missing"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "SUPABASE_SERVICE_ROLE_KEY missing"; exit 1; }

      - name: Probe companies
        id: companies
        continue-on-error: true
        run: node scripts/migration/supabase-rest-export.mjs --probe --tables=companies --page-size=1 --out=tmp/probe-companies

      - name: Probe source_catalog
        id: source_catalog
        continue-on-error: true
        run: node scripts/migration/supabase-rest-export.mjs --probe --tables=source_catalog --page-size=1 --out=tmp/probe-source-catalog

      - name: Probe monitoring_outputs
        id: monitoring_outputs
        continue-on-error: true
        run: node scripts/migration/supabase-rest-export.mjs --probe --tables=monitoring_outputs --page-size=1 --out=tmp/probe-monitoring-outputs

      - name: Probe company_signals
        id: company_signals
        continue-on-error: true
        run: node scripts/migration/supabase-rest-export.mjs --probe --tables=company_signals --page-size=1 --out=tmp/probe-company-signals

      - name: Probe qualification_snapshots
        id: qualification_snapshots
        continue-on-error: true
        run: node scripts/migration/supabase-rest-export.mjs --probe --tables=qualification_snapshots --page-size=1 --out=tmp/probe-qualification-snapshots

      - name: Probe company_patterns
        id: company_patterns
        continue-on-error: true
        run: node scripts/migration/supabase-rest-export.mjs --probe --tables=company_patterns --page-size=1 --out=tmp/probe-company-patterns

      - name: Probe score_snapshots
        id: score_snapshots
        continue-on-error: true
        run: node scripts/migration/supabase-rest-export.mjs --probe --tables=score_snapshots --page-size=1 --out=tmp/probe-score-snapshots

      - name: Probe lead_score_snapshots
        id: lead_score_snapshots
        continue-on-error: true
        run: node scripts/migration/supabase-rest-export.mjs --probe --tables=lead_score_snapshots --page-size=1 --out=tmp/probe-lead-score-snapshots

      - name: Probe pipeline
        id: pipeline
        continue-on-error: true
        run: node scripts/migration/supabase-rest-export.mjs --probe --tables=pipeline --page-size=1 --out=tmp/probe-pipeline

      - name: Enforce all critical probes
        env:
          COMPANIES: ${{ steps.companies.outcome }}
          SOURCE_CATALOG: ${{ steps.source_catalog.outcome }}
          MONITORING_OUTPUTS: ${{ steps.monitoring_outputs.outcome }}
          COMPANY_SIGNALS: ${{ steps.company_signals.outcome }}
          QUALIFICATION_SNAPSHOTS: ${{ steps.qualification_snapshots.outcome }}
          COMPANY_PATTERNS: ${{ steps.company_patterns.outcome }}
          SCORE_SNAPSHOTS: ${{ steps.score_snapshots.outcome }}
          LEAD_SCORE_SNAPSHOTS: ${{ steps.lead_score_snapshots.outcome }}
          PIPELINE: ${{ steps.pipeline.outcome }}
        run: |
          failed=0
          for name in COMPANIES SOURCE_CATALOG MONITORING_OUTPUTS COMPANY_SIGNALS QUALIFICATION_SNAPSHOTS COMPANY_PATTERNS SCORE_SNAPSHOTS LEAD_SCORE_SNAPSHOTS PIPELINE; do
            value="${!name}"
            if [ "$value" != "success" ]; then
              echo "$name failed"
              failed=1
            fi
          done
          exit "$failed"
