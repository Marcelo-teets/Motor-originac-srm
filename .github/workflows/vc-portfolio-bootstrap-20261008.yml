name: VC Portfolio Bootstrap 20261008

on:
  push:
    branches:
      - ops/vc-portfolio-bootstrap-20261008

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_PJwucES3YmFbxf57HE52Bw0v
      VERCEL_PROJECT_ID: prj_hsB473e7bNF0xOd6CEUwo7WFgNYs
      VERCEL_PROJECT_NAME: motor-originac-srm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Load canonical Neon connection
        run: bash scripts/load-neon-from-vercel.sh
      - name: Run all active search profiles in bootstrap mode
        working-directory: backend
        run: npx tsx src/cli/searchProfileBootstrap.ts --max-profiles 4
