name: Resync Credit Review gate with main

on:
  push:
    branches:
      - agent/company-credit-review-gate
    paths:
      - .github/workflows/resync-credit-review-gate.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/company-credit-review-gate
          fetch-depth: 0
      - name: Merge main and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-project-agent"
          git config user.email "openai-project-agent@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/resync-credit-review-gate.yml
          git commit -m "chore: sync Credit Review gate with current main"
          git push origin HEAD:agent/company-credit-review-gate
