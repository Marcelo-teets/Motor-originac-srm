name: Neon Scheduler Smoke 20261008

on:
  push:
    branches:
      - fix/neon-scheduled-jobs-vercel-vault

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_PJwucES3YmFbxf57HE52Bw0v
      VERCEL_PROJECT_ID: prj_hsB473e7bNF0xOd6CEUwo7WFgNYs
      VERCEL_PROJECT_NAME: motor-originac-srm
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      MOTOR_API_BASE_URL: https://motor-originac-srm.vercel.app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Load canonical Neon connection from Vercel vault
        run: bash scripts/load-neon-from-vercel.sh
      - name: Run database scheduler smoke
        run: node scripts/run-neon-scheduled-jobs.mjs "--jobs=reprocessing,entity-resolution"
