name: Sync decision branch with main

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/decision-surface-eligibility-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/decision-surface-eligibility-hardening
          fetch-depth: 0
      - name: Merge latest main and remove workflow
        shell: bash
        run: |
          git config user.name "openai-project-agent"
          git config user.email "openai-project-agent@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          git rm .github/workflows/sync-decision-branch-with-main.yml
          git commit -m "chore: resync decision eligibility hardening with main"
          git push origin HEAD:agent/decision-surface-eligibility-hardening
