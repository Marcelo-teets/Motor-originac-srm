name: Vercel Production Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character SHA currently at the tip of main
        required: true
        type: string
      wait_for_ready:
        description: Retained for compatibility; production always waits for validation
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/deploy-requests/motor-production.txt'

permissions:
  contents: read

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_PJwucES3YmFbxf57HE52Bw0v
      VERCEL_PROJECT_ID: prj_hsB473e7bNF0xOd6CEUwo7WFgNYs
      VERCEL_PROJECT_NAME: motor-originac-srm
      SUPABASE_PROJECT_REF: hdghpmssudrqhsbvrdyt
      PRODUCTION_URL: https://motor-originac-srm.vercel.app
      VERCEL_CLI_VERSION: 50.28.0
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate production inputs
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || {
            echo "VERCEL_TOKEN is missing from GitHub Actions secrets."
            exit 1
          }
          [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "A full 40-character SHA is required."
            exit 1
          }
          CURRENT_SHA="$(git rev-parse HEAD)"
          test "${REQUESTED_SHA,,}" = "${CURRENT_SHA,,}" || {
            echo "Requested SHA $REQUESTED_SHA is not the current main SHA $CURRENT_SHA."
            exit 1
          }

      - name: Confirm automatic Git deployments are paused
        run: node scripts/vercel-production-control.mjs status

      - name: Synchronize canonical public Supabase Auth config
        run: node scripts/sync-public-auth-env-to-vercel.mjs

      - name: Link exact Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          cat > .vercel/project.json <<JSON
          {"orgId":"$VERCEL_ORG_ID","projectId":"$VERCEL_PROJECT_ID","projectName":"$VERCEL_PROJECT_NAME"}
          JSON
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      - name: Validate Neon production data plane before build
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE=".vercel/.env.production.local"
          test -f "$ENV_FILE" || {
            echo "Vercel production env file was not materialized."
            exit 1
          }
          if ! grep -Eq '^(MOTOR_NEON_DATABASE_URL|DATABASE_URL)=' "$ENV_FILE"; then
            echo "Neither MOTOR_NEON_DATABASE_URL nor DATABASE_URL is configured in Vercel production."
            exit 1
          fi
          set -a
          source "$ENV_FILE"
          set +a
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const connectionString = process.env.MOTOR_NEON_DATABASE_URL || process.env.DATABASE_URL;
          if (!connectionString) throw new Error('Neon connection string missing after Vercel pull.');
          const host = new URL(connectionString).hostname;
          if (!host.endsWith('.neon.tech')) throw new Error('Production database URL does not point to Neon.');
          const pool = new pg.Pool({ connectionString, max: 1 });
          try {
            const { rows } = await pool.query(`
              select
                current_database() as database_name,
                to_regclass('public.companies') is not null as companies_ok,
                to_regclass('public.source_catalog') is not null as sources_ok,
                to_regclass('private.database_growth_guard_state') is not null as growth_guard_ok
            `);
            const row = rows[0] || {};
            if (!row.companies_ok || !row.sources_ok || !row.growth_guard_ok) {
              throw new Error('Neon production schema is incomplete.');
            }
            console.log(JSON.stringify({
              provider: 'neon',
              database: row.database_name,
              companiesTable: row.companies_ok,
              sourceCatalogTable: row.sources_ok,
              growthGuard: row.growth_guard_ok,
            }));
          } finally {
            await pool.end();
          }
          NODE

      - name: Build immutable production artifact
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          export GITHUB_SHA="$REQUESTED_SHA"
          export GIT_SHA="$REQUESTED_SHA"
          export VERCEL_GIT_COMMIT_SHA="$REQUESTED_SHA"
          export VERCEL_GIT_COMMIT_REF=main
          export VERCEL_ENV=production
          npx --yes "vercel@$VERCEL_CLI_VERSION" build \
            --prod \
            --token="$VERCEL_TOKEN"
          test -f .vercel/output/config.json || {
            echo "Vercel Build Output API config was not generated."
            exit 1
          }

      - name: Deploy prebuilt artifact to production
        id: deployment
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          DEPLOYMENT_OUTPUT="$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy \
            --prebuilt \
            --prod \
            --yes \
            --archive=tgz \
            --token="$VERCEL_TOKEN" \
            --env "GIT_SHA=$REQUESTED_SHA" \
            --meta "requestedSha=$REQUESTED_SHA" \
            --meta "deploymentController=motor-originacao-prebuilt")"
          DEPLOYMENT_URL="$(printf '%s\n' "$DEPLOYMENT_OUTPUT" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)"
          test -n "$DEPLOYMENT_URL" || {
            echo "Vercel CLI did not return a deployment URL."
            printf '%s\n' "$DEPLOYMENT_OUTPUT"
            exit 1
          }
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: $DEPLOYMENT_URL"

      - name: Validate canonical production Auth rollout
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE_URL="$PRODUCTION_URL" \
          EXPECTED_SHA="$REQUESTED_SHA" \
          REQUIRE_CAPTCHA_SITE_KEY=false \
          node scripts/smoke-auth-production.mjs

      - name: Validate production runtime is using Neon
        shell: bash
        env:
          SMOKE_URL: https://motor-originac-srm.vercel.app/api/data-capture/health
          SMOKE_BEARER_TOKEN: ${{ secrets.CRON_SECRET }}
          EXPECTED_DATA_PROVIDER: neon
          SMOKE_ATTEMPTS: '12'
          SMOKE_DELAY_MS: '10000'
        run: |
          set -euo pipefail
          test -n "$SMOKE_BEARER_TOKEN" || {
            echo "CRON_SECRET is missing; refusing unverified Neon production cutover."
            exit 1
          }
          node scripts/smoke/vercel-health-smoke.mjs

      - name: Run strict CAPTCHA smoke when configured
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
        run: |
          set -euo pipefail
          SITE_KEY_CONFIGURED="$(node -e '
            const response = await fetch(process.env.PRODUCTION_URL + "/build-meta.json", { headers: { "cache-control": "no-cache" } });
            if (!response.ok) process.exit(2);
            const metadata = await response.json();
            process.stdout.write(metadata?.auth?.captcha?.siteKeyConfigured === true ? "true" : "false");
          ')"
          if [ "$SITE_KEY_CONFIGURED" = "true" ]; then
            BASE_URL="$PRODUCTION_URL" \
            EXPECTED_SHA="$REQUESTED_SHA" \
            REQUIRE_CAPTCHA_SITE_KEY=true \
            node scripts/smoke-auth-production.mjs
          else
            echo "CAPTCHA is retired; canonical public Auth configuration was validated."
          fi

      - name: Disconnect legacy Git integration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const projectUrl = new URL(`https://api.vercel.com/v9/projects/${process.env.VERCEL_PROJECT_ID}`);
          projectUrl.searchParams.set('teamId', process.env.VERCEL_ORG_ID);
          const headers = {
            Authorization: `Bearer ${process.env.VERCEL_TOKEN}`,
            Accept: 'application/json',
            'Content-Type': 'application/json',
          };

          const readProject = async () => {
            const response = await fetch(projectUrl, { headers });
            if (!response.ok) throw new Error(`Vercel project lookup failed with HTTP ${response.status}`);
            return response.json();
          };

          const before = await readProject();
          if (before.link) {
            const linkUrl = new URL(`${projectUrl.origin}${projectUrl.pathname}/link`);
            linkUrl.search = projectUrl.search;
            const response = await fetch(linkUrl, { method: 'DELETE', headers, body: '{}' });
            if (!response.ok) {
              const text = await response.text();
              throw new Error(`Vercel Git disconnect failed with HTTP ${response.status}: ${text.slice(0, 300)}`);
            }
            console.log('Disconnected legacy Vercel Git integration.');
          } else {
            console.log('Vercel Git integration was already disconnected.');
          }

          const after = await readProject();
          if (after.link) throw new Error('Vercel project still exposes a Git link after disconnect.');
          NODE

      - name: Confirm automatic deployments remain disabled
        if: always()
        run: node scripts/vercel-production-control.mjs disable-auto
