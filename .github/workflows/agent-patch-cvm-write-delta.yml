name: Agent Patch CVM Write Delta

on:
  push:
    branches:
      - fix/cvm-write-delta
    paths:
      - 'scripts/agent/patch-cvm-write-delta.mjs'
      - '.github/workflows/agent-patch-cvm-write-delta.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cvm-write-delta
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/agent/patch-cvm-write-delta.mjs
      - run: rm scripts/agent/patch-cvm-write-delta.mjs .github/workflows/agent-patch-cvm-write-delta.yml
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/capital-markets/cvmDatasetRegistry.ts backend/src/modules/capital-markets/cvmCapitalMarketConnector.ts backend/src/modules/capital-markets/cvmCapitalMarketConnector.test.ts scripts/agent/patch-cvm-write-delta.mjs .github/workflows/agent-patch-cvm-write-delta.yml
          git commit -m "fix(cvm): stabilize identity and persist content deltas"
          git push origin HEAD:fix/cvm-write-delta
