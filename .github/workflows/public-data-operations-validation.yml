name: Public Data Operations Validation

on:
  pull_request:
    paths:
      - .github/workflows/public-data-operations-validation.yml
      - .github/workflows/provider-runtime-canary.yml
      - api/public-data-operations.ts
      - backend/src/services/publicDataOperationsService.ts
      - backend/src/services/publicDataOperationsService.test.ts
      - db/migrations/059_public_data_operations_snapshot.sql
      - frontend/src/lib/publicDataOperationsApi.ts
      - frontend/src/pages/SourcesPage.tsx
      - vercel.json

permissions:
  contents: read

concurrency:
  group: public-data-operations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test operations service
        working-directory: backend
        run: npx tsx --test src/services/publicDataOperationsService.test.ts
      - name: Typecheck backend
        run: npm -C backend run typecheck
      - name: Typecheck serverless functions
        run: npm run typecheck:serverless
      - name: Build frontend
        run: npm -C frontend run build
