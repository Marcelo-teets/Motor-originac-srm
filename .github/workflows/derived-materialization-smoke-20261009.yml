name: Derived Materialization Smoke 20261009

on:
  push:
    branches:
      - ops/derived-materialization-smoke-20261009

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_PJwucES3YmFbxf57HE52Bw0v
      VERCEL_PROJECT_ID: prj_hsB473e7bNF0xOd6CEUwo7WFgNYs
      VERCEL_PROJECT_NAME: motor-originac-srm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d770c4ced3188f7c1f3f2568ecf6e3014622ea91
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Load Neon production connection
        run: bash scripts/load-neon-from-vercel.sh
      - name: Materialize current eligible companies
        run: npx tsx backend/src/cli/materializeDerivedIntelligence.ts --limit=25
