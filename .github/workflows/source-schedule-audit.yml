name: Source Schedule Coverage Audit

on:
  schedule:
    - cron: "20 12 * * 2"
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/source-schedule-audit.yml
      - scripts/sources/audit-source-schedules.mjs
      - db/migrations/133_cvm_fund_documents_and_source_schedules.sql

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scripts/sources/audit-source-schedules.mjs
      - if: github.event_name != 'pull_request'
        run: node scripts/sources/audit-source-schedules.mjs
