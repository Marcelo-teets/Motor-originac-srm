name: Emergency Supabase Postgres Restart

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/supabase-postgres-emergency-restart.yml

permissions:
  contents: read

concurrency:
  group: supabase-postgres-emergency-restart
  cancel-in-progress: false

jobs:
  restart:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'ops: restart supabase postgres')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: hdghpmssudrqhsbvrdyt
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Require Management API token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in repository secrets."
            exit 1
          fi

      - name: Restart Supabase project
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/restart"

      - name: Wait for project control plane
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            payload="$(curl --silent --show-error --max-time 10 \
              --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}" || true)"
            status="$(printf '%s' "$payload" | python3 -c 'import json,sys;\ntry:\n print(json.load(sys.stdin).get("status", ""))\nexcept Exception:\n print("")')"
            echo "control-plane status=${status:-unknown} attempt=${attempt}"
            if [ "$status" = "ACTIVE_HEALTHY" ]; then
              break
            fi
            sleep 10
          done

      - name: Verify data-plane reachability
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/"
          for attempt in $(seq 1 60); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "$endpoint" || true)"
            echo "data-plane HTTP=${code:-000} attempt=${attempt}"
            if [ -n "$code" ] && [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              echo "Supabase data-plane is reachable."
              exit 0
            fi
            sleep 10
          done
          echo "Supabase data-plane did not recover after restart."
          exit 1
