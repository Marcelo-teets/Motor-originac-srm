name: Agent Patch CVM Normalization

on:
  push:
    branches:
      - gpt/cvm-capital-market-connectors
    paths:
      - scripts/agent/patch-cvm-normalization.mjs
      - .github/workflows/agent-patch-cvm-normalization.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/cvm-capital-market-connectors
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/agent/patch-cvm-normalization.mjs
      - run: rm scripts/agent/patch-cvm-normalization.mjs .github/workflows/agent-patch-cvm-normalization.yml
      - run: npm install
      - run: npm -C backend run typecheck
      - name: Commit normalization fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/capital-markets/cvmCapitalMarketConnector.ts scripts/agent/patch-cvm-normalization.mjs .github/workflows/agent-patch-cvm-normalization.yml
          git commit -m "fix(cvm): normalize offer volume and stable event identity"
          git push origin HEAD:gpt/cvm-capital-market-connectors
