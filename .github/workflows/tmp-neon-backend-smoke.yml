name: Temporary Neon Backend Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/lib/postgres.ts'
      - 'backend/src/lib/postgres.integration.test.ts'
      - '.github/workflows/tmp-neon-backend-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Resolve temporary Neon branch connection without persisting it
        shell: bash
        run: |
          test -n "$NEON_API_KEY"
          MOTOR_NEON_DATABASE_URL="$(npx --yes neon@latest connection-string br-small-wave-b6r4gpez --project-id steep-poetry-38942951 --database-name neondb --pooled)"
          test -n "$MOTOR_NEON_DATABASE_URL"
          echo "::add-mask::$MOTOR_NEON_DATABASE_URL"
          export MOTOR_NEON_DATABASE_URL
          npx tsx --test backend/src/lib/postgres.integration.test.ts
