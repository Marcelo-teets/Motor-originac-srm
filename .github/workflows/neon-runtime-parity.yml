name: Neon Runtime Parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'backend/**'
      - 'serverless/**'
      - 'frontend/**'
      - 'db/neon/**'
      - 'db/migrations/**'
      - 'scripts/lib/**'
      - 'scripts/apply-neon-runtime-migrations.mjs'
      - 'scripts/neon-runtime-parity-check.mjs'
      - '.github/workflows/neon-runtime-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOTOR_NEON_DATABASE_URL: ${{ secrets.MOTOR_NEON_DATABASE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Load Neon production connection from canonical vault
        run: bash scripts/load-neon-from-vercel.sh
      - name: Verify Neon production connection is available
        run: test -n "$MOTOR_NEON_DATABASE_URL" || (echo "MOTOR_NEON_DATABASE_URL is missing" && exit 2)
      - name: Apply tracked Neon runtime migrations for cutover PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/neon-db-cutover'
        run: node scripts/apply-neon-runtime-migrations.mjs
      - name: Check required Neon runtime schema
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'chore/neon-db-cutover'
        run: node scripts/neon-runtime-parity-check.mjs

      - name: Validate Neon migration/runtime contracts on ordinary PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref != 'chore/neon-db-cutover'
        run: node --test scripts/neon-migration-plan-contract.test.mjs scripts/neon-runtime-contract.test.mjs
