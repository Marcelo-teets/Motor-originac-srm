name: Public Bulk Owner Dispatch

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

concurrency:
  group: public-bulk-owner-dispatch-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  public-bulk:
    if: >-
      github.event.issue.user.login == 'Marcelo-teets' &&
      (github.event.issue.title == '[public-bulk-run] ceis-cnep-canary' ||
       github.event.issue.title == '[public-bulk-run] all-light')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate production ingestion secrets
        id: secrets
        continue-on-error: true
        run: |
          test -n "$SUPABASE_URL" || (echo "SUPABASE_URL is missing" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "SUPABASE_SERVICE_ROLE_KEY is missing" && exit 1)
      - name: Resolve owner dispatch scope
        id: scope
        shell: bash
        run: |
          if [ "$ISSUE_TITLE" = "[public-bulk-run] all-light" ]; then
            echo "mode=all-light" >> "$GITHUB_OUTPUT"
            echo "run_label=all-light" >> "$GITHUB_OUTPUT"
          else
            echo "mode=canary" >> "$GITHUB_OUTPUT"
            echo "run_label=CEIS/CNEP canary" >> "$GITHUB_OUTPUT"
          fi
          echo "log_file=public-bulk-owner.log" >> "$GITHUB_OUTPUT"
      - name: Execute official-data production ingestion
        id: ingestion
        if: steps.secrets.outcome == 'success'
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: |
          set +e
          LOG_FILE="${{ steps.scope.outputs.log_file }}"
          : > "$LOG_FILE"
          STATUS=0

          run_dataset() {
            local dataset="$1"
            local max_resources="$2"
            local full_coverage="$3"
            local label="$4"
            local args=(
              --dataset "$dataset"
              --max-matched-rows 100000
              --max-resources "$max_resources"
              --trigger manual
              --require-scan
            )
            if [ "$full_coverage" = "true" ]; then args+=(--full-coverage); fi
            echo "===== $label =====" | tee -a "$LOG_FILE"
            npx tsx src/cli/publicBulkData.ts "${args[@]}" 2>&1 | tee -a "$LOG_FILE"
            local command_status=${PIPESTATUS[0]}
            if [ "$command_status" -ne 0 ]; then STATUS=1; fi
          }

          if [ "${{ steps.scope.outputs.mode }}" = "all-light" ]; then
            run_dataset "bndes_financing_operations" "1" "false" "BNDES nonautomatic light resource"
            run_dataset "compras_contracts" "1" "true" "Portal da Transparência Compras contracts"
          fi
          run_dataset "cgu_ceis,cgu_cnep" "2" "true" "CGU CEIS/CNEP"

          exit "$STATUS"
      - name: Report execution result
        if: always()
        shell: bash
        run: |
          SECRET_OUTCOME="${{ steps.secrets.outcome }}"
          INGESTION_OUTCOME="${{ steps.ingestion.outcome }}"
          LOG_FILE="${{ steps.scope.outputs.log_file }}"
          LOG_TAIL="No ingestion log was created."
          if [ -n "$LOG_FILE" ] && [ -f "backend/$LOG_FILE" ]; then
            LOG_TAIL=$(tail -n 100 "backend/$LOG_FILE" | sed 's/`/\`/g')
          fi
          BODY=$(cat <<EOF
          Public bulk ${{ steps.scope.outputs.run_label }} diagnostics:

          - secret check: **${SECRET_OUTCOME}**
          - ingestion: **${INGESTION_OUTCOME}**
          - BNDES scope: lightweight nonautomatic CSV only; source remains partial until the heavy automatic file is processed separately
          - Compras scope: official monthly contract archive
          - CGU scope: CEIS and CNEP

          Sanitized log tail:

          \`\`\`text
          ${LOG_TAIL}
          \`\`\`

          Operational details are persisted in \`public_dataset_runs\`, \`public_dataset_resource_checkpoints\` and downstream decision tables when matches exist.
          EOF
          )
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$BODY"
      - name: Enforce successful ingestion
        if: always()
        run: |
          test "${{ steps.secrets.outcome }}" = "success"
          test "${{ steps.ingestion.outcome }}" = "success"
