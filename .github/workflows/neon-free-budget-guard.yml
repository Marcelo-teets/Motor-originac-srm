name: Neon Free Budget Guard

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/neon-free-budget-guard.yml'
      - 'scripts/neon-free-budget-guard.mjs'

permissions:
  contents: read
  actions: write

concurrency:
  group: neon-free-budget-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: steep-poetry-38942951
      ARMED: ${{ vars.NEON_GUARD_ACTIVE }}
      CUTOVER_VERIFIED: ${{ vars.NEON_CUTOVER_VERIFIED }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check guard contract
        run: node --test scripts/neon-free-budget-guard.test.mjs
      - name: Enforce max 1 CU per endpoint only after verified cutover
        if: env.ARMED == 'true' && env.CUTOVER_VERIFIED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEON_API_KEY:-}" ]; then
            echo 'Neon key missing; leaving workloads for fail-closed check'
            exit 0
          fi
          node --input-type=module <<'NODE'
          const base='https://console.neon.tech/api/v2/projects/'+process.env.NEON_PROJECT_ID;
          const headers={Authorization:'Bearer '+process.env.NEON_API_KEY,'Content-Type':'application/json'};
          const res=await fetch(base+'/endpoints',{headers});
          if(!res.ok) throw new Error('Cannot inspect compute limits: HTTP '+res.status);
          const {endpoints}=await res.json();
          if(!Array.isArray(endpoints)) throw new Error('Unknown Neon endpoints response');
          for(const endpoint of endpoints){
            const max=endpoint.autoscaling_limit_max_cu;
            if(typeof max!=='number') throw new Error('Unknown compute limit');
            if(max<=1) continue;
            const min=endpoint.autoscaling_limit_min_cu;
            const body={endpoint:{autoscaling_limit_max_cu:1}};
            if(typeof min!=='number') throw new Error('Unknown min compute limit');
            if(min>1) body.endpoint.autoscaling_limit_min_cu=0.25;
            const update=await fetch(base+'/endpoints/'+encodeURIComponent(endpoint.id),{
              method:'PATCH',headers,body:JSON.stringify(body)});
            if(!update.ok) throw new Error('Compute cap update rejected: HTTP '+update.status);
            console.log('Reduced compute endpoint to maximum 1 CU:',endpoint.id);
          }
          NODE
      - name: Inspect monthly budget and branches
        id: budget
        shell: bash
        run: |
          set +e
          node scripts/neon-free-budget-guard.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Fail-closed heavy ingestion after verified cutover on unsafe telemetry
        if: env.ARMED == 'true' && env.CUTOVER_VERIFIED == 'true' && steps.budget.outputs.allowed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'Resource guard unsafe: disabling scheduled heavy ingestion (no data deletion).'
          workflows=(
            capture.yml search-profile-discovery.yml candidate-domain-intelligence.yml
            capital-market-ingestion.yml public-bulk-ingestion.yml
            tech-signals-people-capital.yml cvm-fund-documents-schedule.yml
            bndes-automatic-datastore.yml strategic-public-data.yml
          )
          failures=0
          for workflow in "${workflows[@]}"; do
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/disable" >/dev/null ||
              failures=$((failures+1))
          done
          echo "Disabled heavy schedulers; failures=$failures" >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0
      - name: TEMP read-only Neon account inventory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base='https://console.neon.tech/api/v2';
          const headers={Authorization:'Bearer '+process.env.NEON_API_KEY,Accept:'application/json'};
          async function get(path){
            const res=await fetch(base+path,{headers,signal:AbortSignal.timeout(15000)});
            const text=await res.text();
            let body=null; try{body=text?JSON.parse(text):null}catch{body={raw:text.slice(0,400)}}
            return {ok:res.ok,status:res.status,body};
          }
          const pv=p=>({id:p?.id??null,name:p?.name??null,org_id:p?.org_id??null,region_id:p?.region_id??null,pg_version:p?.pg_version??null,created_at:p?.created_at??null,updated_at:p?.updated_at??null});
          const bv=b=>({id:b?.id??null,project_id:b?.project_id??null,name:b?.name??null,parent_id:b?.parent_id??null,primary:b?.primary??null,protected:b?.protected??null,init_source:b?.init_source??null,created_at:b?.created_at??null,updated_at:b?.updated_at??null});
          const projects=await get('/projects?limit=100');
          console.log('NEON_PROJECTS_RESULT='+JSON.stringify({ok:projects.ok,status:projects.status,projects:Array.isArray(projects.body?.projects)?projects.body.projects.map(pv):[],pagination:projects.body?.pagination??null,error:projects.ok?null:projects.body}));
          const ids=[...new Set([...(Array.isArray(projects.body?.projects)?projects.body.projects.map(p=>p.id):[]),'steep-poetry-38942951','little-hat-27601841','round-hat-79088822'].filter(Boolean))];
          for(const id of ids){
            const br=await get('/projects/'+encodeURIComponent(id)+'/branches?limit=100');
            console.log('NEON_BRANCHES_RESULT='+JSON.stringify({project_id:id,ok:br.ok,status:br.status,branches:Array.isArray(br.body?.branches)?br.body.branches.map(bv):[],pagination:br.body?.pagination??null,error:br.ok?null:br.body}));
          }
          NODE
      - name: Publish status
        if: always()
        shell: bash
        env:
          BUDGET_ALLOWED: ${{ steps.budget.outputs.allowed }}
          BUDGET_REASONS: ${{ steps.budget.outputs.reasons }}
        run: |
          {
            printf '## Neon Free budget guard\n\n'
            printf '%s\n' "- Project: $NEON_PROJECT_ID"
            printf '%s\n' "- Armed: $ARMED"
            printf '%s\n' "- Neon cutover verified: $CUTOVER_VERIFIED"
            printf '%s\n' "- Budget allowed: ${BUDGET_ALLOWED:-unknown}"
            printf '%s\n' "- Reasons: ${BUDGET_REASONS:-not_checked}"
            printf '%s\n' '- Storage stop: 425 MB of 500 MB (85%)'
            printf '%s\n' '- Compute stop: 85 estimated upper-bound CU-hours of 100 (85%)'
            printf '%s\n' '- Branch ceiling: 9 of 10; verify automatic preview cleanup'
            printf '%s\n' '- Endpoint ceiling: max 1 CU (requires post-cutover activation)'
            printf '%s\n' '- Unknown metrics fail closed; cannot guarantee against out-of-band writes or between-check spikes.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Signal failed or unsafe protection
        if: env.ARMED == 'true' && env.CUTOVER_VERIFIED == 'true' && steps.budget.outputs.allowed != 'true'
        run: exit 1
