name: Knowledge Learning Agent Validation

on:
  pull_request:
    paths:
      - 'backend/src/ai/knowledgeLearningAgent.ts'
      - 'backend/src/ai/knowledgeLearningAgent.test.ts'
      - 'api/agentetome.ts'
      - 'db/migrations/104_knowledge_learning_agent.sql'
      - 'db/migrations/105_knowledge_learning_agent_link_fix.sql'
      - 'frontend/src/lib/knowledgeLearningApi.ts'
      - 'frontend/src/lib/knowledgeLearningTypes.ts'
      - 'frontend/src/pages/KnowledgeLearningAgentPage.tsx'
      - 'frontend/src/styles/knowledge-learning-agent.css'
      - '.github/workflows/knowledge-learning-agent.yml'
      - '.github/workflows/knowledge-learning-agent-validation.yml'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-learning-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Test evidence and hypothesis guardrails
        run: npx tsx --test backend/src/ai/knowledgeLearningAgent.test.ts
      - name: Typecheck backend
        run: npm -C backend run typecheck
      - name: Typecheck frontend
        run: npm -C frontend run typecheck
      - name: Typecheck Vercel functions
        run: npm run typecheck:serverless
