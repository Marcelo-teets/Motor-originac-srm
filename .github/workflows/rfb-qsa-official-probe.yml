name: RFB QSA Official Probe

on:
  pull_request:
    paths:
      - .github/workflows/rfb-qsa-official-probe.yml
      - backend/src/cli/probeRfbQsa.ts
      - backend/src/modules/public-data/strategicPublicDatasetConnector.ts
      - backend/src/services/strategicPublicIngestionService.ts
  workflow_dispatch:
    inputs:
      cnpj:
        description: CNPJ revisado para o probe oficial
        required: true
        default: "17770708000124"
        type: string
      reference:
        description: Competência da Receita (YYYY-MM)
        required: false
        default: "2026-07"
        type: string
      max_resources:
        description: Máximo de partições Socios a verificar
        required: true
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: rfb-qsa-official-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TARGET_CNPJ: ${{ inputs.cnpj || '17770708000124' }}
      TARGET_REFERENCE: ${{ inputs.reference || '2026-07' }}
      MAX_RESOURCES: ${{ inputs.max_resources || '20' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck backend
        run: npm -C backend run typecheck
      - name: Probe official RFB QSA without persistence
        working-directory: backend
        shell: bash
        run: |
          npx tsx src/cli/probeRfbQsa.ts \
            --cnpj "$TARGET_CNPJ" \
            --reference "$TARGET_REFERENCE" \
            --max-resources "$MAX_RESOURCES" \
            --max-matched-rows 1000 \
            --require-match
