name: RFB QSA Official Probe

on:
  pull_request:
    paths:
      - .github/workflows/rfb-qsa-official-probe.yml
      - backend/src/cli/probeRfbQsa.ts
      - backend/src/modules/public-data/strategicPublicDatasetConnector.ts
      - backend/src/services/strategicPublicIngestionService.ts
  workflow_dispatch:
    inputs:
      cnpj:
        description: CNPJ revisado para o probe oficial
        required: true
        default: "17770708000124"
        type: string
      reference:
        description: Competência opcional da Receita (YYYY-MM); vazio usa a mais recente
        required: false
        default: ""
        type: string
      max_resources:
        description: Máximo de partições Socios a verificar
        required: true
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: rfb-qsa-official-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TARGET_CNPJ: ${{ inputs.cnpj || '17770708000124' }}
      TARGET_REFERENCE: ${{ inputs.reference || '' }}
      MAX_RESOURCES: ${{ inputs.max_resources || '20' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck backend
        run: npm -C backend run typecheck
      - name: Probe official RFB QSA without persistence
        id: qsa_probe
        working-directory: backend
        shell: bash
        continue-on-error: true
        run: |
          ARGS=(
            --cnpj "$TARGET_CNPJ"
            --max-resources "$MAX_RESOURCES"
            --max-matched-rows 1000
            --require-match
          )
          if [ -n "$TARGET_REFERENCE" ]; then ARGS+=(--reference "$TARGET_REFERENCE"); fi
          set +e
          npx tsx src/cli/probeRfbQsa.ts "${ARGS[@]}" > "$RUNNER_TEMP/qsa-probe.log" 2>&1
          EXIT_CODE=$?
          set -e
          cat "$RUNNER_TEMP/qsa-probe.log"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
      - name: Upload QSA probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfb-qsa-probe-diagnostics
          path: ${{ runner.temp }}/qsa-probe.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce QSA probe result
        if: always()
        shell: bash
        run: |
          test "${{ steps.qsa_probe.outputs.exit_code }}" = "0"
