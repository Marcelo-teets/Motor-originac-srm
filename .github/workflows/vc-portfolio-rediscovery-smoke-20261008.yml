name: VC Portfolio Rediscovery Smoke 20261008

on:
  push:
    branches:
      - ops/vc-portfolio-rediscovery-smoke-20261008

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCOVERY_TOKEN: ${{ secrets.CRON_SECRET }}
      DISCOVERY_URL: https://motor-originac-srm.vercel.app/api/search-profiles/cron/run
    steps:
      - name: Run production discovery once
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DISCOVERY_TOKEN" || { echo "CRON_SECRET missing"; exit 2; }
          RESPONSE="$(curl -sS --max-time 90 -X POST -w '\nHTTP_STATUS:%{http_code}\n'             -H "Authorization: Bearer ${DISCOVERY_TOKEN}"             "$DISCOVERY_URL")"
          echo "$RESPONSE"
          STATUS="$(echo "$RESPONSE" | awk -F: '/HTTP_STATUS:/{print $2}')"
          test "$STATUS" -ge 200 -a "$STATUS" -lt 300
          echo "$RESPONSE" | grep -q 'activeProfiles'
