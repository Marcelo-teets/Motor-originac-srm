name: CVM Production Intelligence

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/cvm-production-intelligence.yml
      - backend/src/modules/capital-markets/**
      - backend/src/services/capitalMarketIngestionService.ts
      - backend/src/services/capitalMarketBatchPersistence.test.ts
      - backend/src/services/cvmProductionIntelligence.test.ts
      - db/migrations/125_cvm_production_intelligence_foundation.sql
      - db/migrations/126_cvm_production_intelligence_signals.sql
      - db/migrations/127_cvm_production_intelligence_delivery_views.sql
      - db/migrations/128_cvm_explicit_candidate_delivery.sql
      - db/migrations/129_cvm_atomic_batch_persistence.sql
      - db/migrations/136_cvm_free_tier_storage_guard.sql
  push:
    branches: [main]
    paths:
      - .github/workflows/cvm-production-intelligence.yml
      - backend/src/modules/capital-markets/**
      - backend/src/services/capitalMarketIngestionService.ts
      - backend/src/services/capitalMarketBatchPersistence.test.ts
      - backend/src/services/cvmProductionIntelligence.test.ts
      - db/migrations/125_cvm_production_intelligence_foundation.sql
      - db/migrations/126_cvm_production_intelligence_signals.sql
      - db/migrations/127_cvm_production_intelligence_delivery_views.sql
      - db/migrations/128_cvm_explicit_candidate_delivery.sql
      - db/migrations/129_cvm_atomic_batch_persistence.sql
      - db/migrations/136_cvm_free_tier_storage_guard.sql
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset CVM estendido ou all_extended
        required: true
        default: all_extended
        type: choice
        options:
          - all_extended
          - cvm_securitization_ots
          - cvm_company_fre
          - cvm_company_itr
          - cvm_company_dfp
      reference:
        description: Competência opcional (YYYY-MM ou YYYY)
        required: false
        type: string
      max_rows:
        description: Limite de linhas por dataset
        required: true
        default: "25000"
        type: string

permissions:
  contents: read

concurrency:
  group: cvm-production-intelligence-${{ github.ref }}
  cancel-in-progress: true

env:
  EXTENDED_DATASETS: cvm_securitization_ots,cvm_company_fre,cvm_company_itr,cvm_company_dfp

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck backend
        id: typecheck
        shell: bash
        run: |
          set +e
          npm -C backend run typecheck > typecheck.log 2>&1
          CODE=$?
          cat typecheck.log
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cvm-typecheck-${{ github.run_id }}
          path: typecheck.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce typecheck result
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1
      - name: Test CVM production intelligence
        working-directory: backend
        run: >-
          npm exec -- tsx --test
          src/modules/capital-markets/cvmCapitalMarketConnector.test.ts
          src/services/capitalMarketIngestionService.test.ts
          src/services/capitalMarketBatchPersistence.test.ts
          src/services/cvmProductionIntelligence.test.ts

  ingest:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: capital-market-ingestion
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REQUESTED_DATASET: ${{ inputs.dataset || '' }}
      REQUESTED_REFERENCE: ${{ inputs.reference || '' }}
      REQUESTED_MAX_ROWS: ${{ inputs.max_rows || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate production secrets
        run: |
          test -n "$SUPABASE_URL" || (echo "SUPABASE_URL is missing" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "SUPABASE_SERVICE_ROLE_KEY is missing" && exit 1)
      - name: Resolve ingestion scope
        id: scope
        shell: bash
        run: |
          DATASET="${REQUESTED_DATASET:-all_extended}"
          if [ "$DATASET" = "all_extended" ]; then DATASET="$EXTENDED_DATASETS"; fi
          MAX_ROWS="${REQUESTED_MAX_ROWS:-25000}"
          echo "dataset=$DATASET" >> "$GITHUB_OUTPUT"
          echo "max_rows=$MAX_ROWS" >> "$GITHUB_OUTPUT"
      - name: Ingest and deliver official CVM datasets
        working-directory: backend
        shell: bash
        run: |
          ARGS=(
            --dataset "${{ steps.scope.outputs.dataset }}"
            --max-rows "${{ steps.scope.outputs.max_rows }}"
            --trigger manual
            --require-delivery
          )
          if [ -n "$REQUESTED_REFERENCE" ]; then ARGS+=(--reference "$REQUESTED_REFERENCE"); fi
          npm exec -- tsx src/cli/capitalMarkets.ts "${ARGS[@]}"
      - name: Verify persisted delivery
        working-directory: backend
        run: >-
          npm exec -- tsx src/cli/capitalMarketDelivery.ts
          --dataset "${{ steps.scope.outputs.dataset }}"
          --require-delivery
