name: Neon Scheduled Jobs

# Replaces the legacy pg_cron jobs. Neon only allows pg_cron in the "postgres"
# database, so the Motor runtime (database "neondb") is driven from here.
# Each schedule string selects its own job (github.event.schedule).
# F1-04 (Planejamento V5): GitHub delivered ~32 of the hundreds of expected
# */5 and */15 runs on 07-09/10/2026, so the minute-level jobs are chained in a
# single */15 run in dependency order: reprocessing → entity resolution →
# derived materialization. One run per window instead of two competing ones.
on:
  schedule:
    - cron: '*/15 * * * *'   # reprocessing + entity-resolution + derived-intelligence-materialization
    # agentetome-due-export-refresh: sem cron até AGENTETOME_API_KEY existir na Vercel (decisão D-05, 09/10/2026);
    # continua disponível via workflow_dispatch com jobs=agentetome.
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Comma-separated jobs: reprocessing, entity-resolution, derived-materialization, agentetome'
        required: true
        default: 'reprocessing,entity-resolution,derived-materialization'

permissions:
  contents: read

concurrency:
  group: neon-scheduled-jobs-${{ github.event.schedule || inputs.jobs }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      MOTOR_NEON_DATABASE_URL: ${{ secrets.MOTOR_NEON_DATABASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_PJwucES3YmFbxf57HE52Bw0v
      VERCEL_PROJECT_ID: prj_hsB473e7bNF0xOd6CEUwo7WFgNYs
      VERCEL_PROJECT_NAME: motor-originac-srm
      MOTOR_API_BASE_URL: https://motor-originac-srm.vercel.app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Load canonical Neon connection from Vercel vault
        if: contains(github.event.schedule || inputs.jobs, '*/15') || contains(inputs.jobs || '', 'reprocessing') || contains(inputs.jobs || '', 'entity-resolution') || contains(inputs.jobs || '', 'derived-materialization')
        run: bash scripts/load-neon-from-vercel.sh

      - name: Resolve jobs for this trigger
        id: jobs
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOBS: ${{ inputs.jobs }}
        run: |
          case "$SCHEDULE" in
            '*/15 * * * *') JOBS='reprocessing,entity-resolution,derived-materialization' ;;
            *) JOBS="$INPUT_JOBS" ;;
          esac
          if ! printf '%s' "$JOBS" | grep -Eq '^[a-z,-]+$'; then echo "Invalid jobs: $JOBS"; exit 1; fi
          echo "jobs=${JOBS}" >> "$GITHUB_OUTPUT"
          echo "Resolved jobs: ${JOBS}"

      - name: Validate secrets
        shell: bash
        env:
          JOBS: ${{ steps.jobs.outputs.jobs }}
        run: |
          case "$JOBS" in
            *reprocessing*|*entity-resolution*|*derived-materialization*) test -n "$MOTOR_NEON_DATABASE_URL" || (echo "MOTOR_NEON_DATABASE_URL is missing" && exit 1) ;;
          esac
          case "$JOBS" in
            *agentetome*) test -n "$CRON_SECRET" || (echo "CRON_SECRET is missing" && exit 1) ;;
          esac

      - name: Run SQL/HTTP jobs
        env:
          JOBS: ${{ steps.jobs.outputs.jobs }}
        shell: bash
        run: |
          RUNTIME_JOBS="$(printf '%s' "$JOBS" | tr ',' '\n' | grep -v '^derived-materialization$' | paste -sd, -)"
          if [ -n "$RUNTIME_JOBS" ]; then
            node scripts/run-neon-scheduled-jobs.mjs "--jobs=$RUNTIME_JOBS"
          fi

      - name: Materialize derived origination intelligence
        if: contains(steps.jobs.outputs.jobs, 'derived-materialization')
        run: npx tsx backend/src/cli/materializeDerivedIntelligence.ts --limit=25
